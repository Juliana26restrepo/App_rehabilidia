<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 6: Secuenciación e Interferencia - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; 
            --bg: #F3E5F5; 
            --gold: #FFD700; 
            --navy: #103A57; 
            --white: #ffffff;
            --distractor-red: #FF1744;
            --distractor-yellow: #FFEA00;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: #1a1a1a; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px;
            background: var(--bg); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            background: var(--navy); color: white; height: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; flex-shrink: 0;
        }

        #contenedor-juego { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 10px;
        }

        .panel-instruccion { 
            background: var(--white); padding: 15px; border-radius: 20px; 
            border: 3px solid var(--p-purple); width: 90%; max-width: 600px; 
            margin-bottom: 20px; font-weight: bold; font-size: 1.2rem; 
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }

        .zona-numeros {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 12px; width: 95%; max-width: 850px; padding: 10px;
        }

        .numero-btn {
            background: var(--white); border: 3px solid var(--navy);
            border-radius: 12px; height: 75px; font-size: 1.8rem;
            font-weight: 800; color: var(--navy); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; box-shadow: 0 4px 0 var(--navy);
        }

        .numero-btn.seleccionado { visibility: hidden; pointer-events: none; }

        @keyframes flash-red { 0%, 100% { background: white; } 50% { background: var(--distractor-red); color: white; } }
        @keyframes flash-yellow { 0%, 100% { background: white; } 50% { background: var(--distractor-yellow); color: var(--navy); } }

        .interferencia-roja { animation: flash-red 0.8s infinite; }
        .interferencia-amarilla { animation: flash-yellow 1s infinite; }

        .area-asistente { 
            width: 100%; background: white; padding: 10px 20px; 
            display: flex; align-items: center; gap: 15px; 
            border-top: 4px solid var(--p-purple); height: 110px;
        }

        .avatar-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--p-purple); overflow: hidden; }
        .burbuja { background: #F5F5F5; padding: 10px; border-radius: 12px; font-size: 0.9rem; flex: 1; height: 75px; overflow-y: auto; color: var(--navy); }

        #overlay-final { 
            position: absolute; inset: 0; display: none; flex-direction: column; 
            justify-content: center; align-items: center; background: rgba(16, 58, 87, 0.98); 
            z-index: 3000; color: white; text-align: center;
        }

        .cuadro-final { background: white; color: var(--navy); padding: 30px; border-radius: 25px; width: 90%; max-width: 450px; }
        .btn-finalizar { background: var(--gold); border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.2rem; color: var(--p-purple); margin-top: 20px; }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 6</header>

    <div id="contenedor-juego">
        <div id="info-progreso" style="font-weight: bold; color: var(--p-purple); margin-bottom: 5px;">Nivel 1 - Ronda 1/3</div>
        <div id="panel-instruccion" class="panel-instruccion">Cargando...</div>
        <div id="zona-numeros" class="zona-numeros"></div>
    </div>

    <div class="area-asistente">
        <div class="avatar-img"><img src="https://raw.githubusercontent.com/Anmameche/Rehabilidia/main/coterapeuta.png" style="width:100%"></div>
        <div class="burbuja" id="texto-asistente">Juan, concéntrate solo en el orden de los números. Ignora los colores.</div>
    </div>

    <div id="overlay-final">
        <div class="cuadro-final">
            <h2 style="color: var(--p-purple); margin:0;">SESIÓN COMPLETADA</h2>
            <div id="resumen-stats" style="font-size: 1.2rem; margin: 20px 0;"></div>
            <p style="font-weight: bold;">"Tu mente se adapta cada vez mejor a los cambios."</p>
            <button class="btn-finalizar" onclick="guardarYSalir()">GUARDAR Y VOLVER</button>
        </div>
    </div>
</div>

<script>
    // BANCO DE NÚMEROS PROPORCIONADO
    const bancoNumeros = [
        3, 5, 7, 8, 9, 12, 14, 15, 18, 19, 21, 22, 24, 26, 27, 29, 31, 33, 34, 36,
        38, 39, 41, 42, 44, 46, 47, 49, 51, 52, 54, 55, 57, 59, 60, 62, 63, 65, 67, 68,
        70, 71, 73, 74, 76, 78, 79, 81, 82, 84, 86, 87, 89, 90, 92, 94, 95, 97, 98, 100,
        102, 103, 105, 106, 108, 110, 111, 113, 114, 116, 118, 119, 121, 122, 124, 126, 
        127, 129, 130, 132, 134, 135, 137, 138, 140, 142, 143, 145, 146, 148, 150, 151, 
        153, 154, 156, 158, 159, 161, 162, 164, 166, 167, 169, 170, 172, 174, 175, 177, 
        178, 180, 182, 183, 185, 186, 188, 190, 191, 193, 194, 196, 198, 199, 201, 202, 
        204, 206, 207, 209, 210, 212, 214, 215, 217, 218, 220, 222, 223, 225, 226, 228, 
        230, 231, 233, 234, 236, 238, 239, 241, 242, 244, 246, 247, 249, 250, 252, 254, 
        255, 257, 258, 260, 262, 263, 265, 266, 268, 270, 271, 273, 274, 276, 278, 279, 
        281, 282, 284, 286, 287, 289, 290, 292, 294, 295, 297, 298, 300, 302, 303, 305, 306, 308
    ];

    let nivel = 1;
    let ronda = 1;
    let aciertos = 0;
    let errores = 0;
    let secuenciaCorrecta = [];
    let indiceIntento = 0;
    let timerInterferencia;

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
        document.getElementById('texto-asistente').innerText = t;
    }

    function iniciarSesion() {
        hablar("Juan, vamos a organizar los números. Ignora los colores que cambian.");
        cargarRonda();
    }

    function cargarRonda() {
        const zona = document.getElementById('zona-numeros');
        const instruccion = document.getElementById('panel-instruccion');
        const progreso = document.getElementById('info-progreso');
        zona.innerHTML = "";
        indiceIntento = 0;

        progreso.innerText = `Nivel ${nivel} - Ronda ${ronda}/3`;

        // Cantidad de números según nivel
        let cantidad = nivel === 1 ? 5 : (nivel === 2 ? 8 : 10);
        
        // Obtener números aleatorios del BANCO sin repetir
        let numerosRonda = [];
        let copiaBanco = [...bancoNumeros];
        for(let i=0; i<cantidad; i++) {
            let index = Math.floor(Math.random() * copiaBanco.length);
            numerosRonda.push(copiaBanco.splice(index, 1)[0]);
        }

        // Determinar lógica
        let tipoOrden = "MENOR A MAYOR";
        if (nivel === 2) tipoOrden = "MAYOR A MENOR";
        if (nivel === 3) tipoOrden = Math.random() > 0.5 ? "MENOR A MAYOR" : "MAYOR A MENOR";

        instruccion.innerText = `ORDENA DE ${tipoOrden}`;
        hablar(instruccion.innerText);

        if (tipoOrden === "MENOR A MAYOR") {
            secuenciaCorrecta = [...numerosRonda].sort((a,b) => a - b);
        } else {
            secuenciaCorrecta = [...numerosRonda].sort((a,b) => b - a);
        }

        // Crear botones (mezclados para que no aparezcan ordenados)
        numerosRonda.sort(() => Math.random() - 0.5).forEach(num => {
            const btn = document.createElement('div');
            btn.className = "numero-btn";
            btn.innerText = num;
            btn.onclick = () => validar(num, btn);
            zona.appendChild(btn);
        });

        iniciarInterferencia();
    }

    function iniciarInterferencia() {
        if(timerInterferencia) clearInterval(timerInterferencia);
        timerInterferencia = setInterval(() => {
            const botones = document.querySelectorAll('.numero-btn:not(.seleccionado)');
            botones.forEach(b => {
                b.classList.remove('interferencia-roja', 'interferencia-amarilla');
                let r = Math.random();
                if(r < 0.25) b.classList.add('interferencia-roja');
                else if(r < 0.50) b.classList.add('interferencia-amarilla');
            });
        }, 1100);
    }

    function validar(valor, btn) {
        if (valor === secuenciaCorrecta[indiceIntento]) {
            btn.classList.add('seleccionado');
            indiceIntento++;
            aciertos++;
            
            if (indiceIntento === secuenciaCorrecta.length) {
                ronda++;
                if (ronda > 3) {
                    if (nivel < 3) {
                        nivel++; ronda = 1;
                        hablar("¡Muy bien! Subimos de nivel.");
                        setTimeout(cargarRonda, 1500);
                    } else {
                        finalizar();
                    }
                } else {
                    setTimeout(cargarRonda, 800);
                }
            }
        } else {
            errores++;
            btn.style.background = "#FFCDD2";
            hablar("Ese no es el siguiente.");
            setTimeout(() => { if(!btn.classList.contains('seleccionado')) btn.style.background = "white"; }, 400);
        }
    }

    function finalizar() {
        clearInterval(timerInterferencia);
        document.getElementById('overlay-final').style.display = 'flex';
        const total = aciertos + errores;
        const efic = Math.round((aciertos / total) * 100) || 0;
        document.getElementById('resumen-stats').innerHTML = `Eficacia: ${efic}%<br>Aciertos: ${aciertos}`;
        hablar("Sesión completada Juan. Tu mente se adapta cada vez mejor a los cambios.");
    }

    function guardarYSalir() {
        const total = aciertos + errores;
        const efic = Math.round((aciertos / total) * 100) || 0;
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas",
            id_sesion: 6,
            aciertos: aciertos,
            errores: errores,
            eficacia: efic + "%"
        };
        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
