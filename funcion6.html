<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 6: Toma de Decisiones - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; 
            --bg: #FFF3E0; 
            --gold: #FFD700; 
            --navy: #103A57; 
            --white: #ffffff;
            --success: #4CAF50;
            --error: #F44336;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px;
            background: var(--bg);
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        header { 
            background: var(--navy); color: white; height: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; flex-shrink: 0; font-size: 1rem;
        }

        #contenedor-juego { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: flex-start; padding: 20px;
        }

        .tarjeta-situacion {
            background: white; padding: 20px; border-radius: 20px;
            border: 4px solid var(--p-purple); width: 95%; max-width: 600px;
            text-align: center; box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px; animation: slideIn 0.5s;
        }

        .texto-situacion { font-size: 1.3rem; font-weight: bold; color: var(--navy); margin: 0; }

        .zona-opciones { 
            display: flex; flex-direction: column; gap: 12px; width: 95%; max-width: 600px;
        }

        .btn-opcion {
            background: white; border: 3px solid var(--navy); padding: 18px;
            border-radius: 15px; font-size: 1.1rem; font-weight: 600;
            cursor: pointer; color: var(--navy); transition: 0.2s;
            text-align: left; box-shadow: 0 4px 0 var(--navy);
        }

        .btn-opcion:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
        .btn-opcion.correcta { background: var(--success); color: white; border-color: #2E7D32; }
        .btn-opcion.incorrecta { background: var(--error); color: white; border-color: #C62828; }

        .area-asistente { 
            width: 100%; background: white; padding: 10px 20px; 
            display: flex; align-items: center; gap: 15px; 
            border-top: 4px solid var(--p-purple); height: 110px; flex-shrink: 0;
        }

        .avatar-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--p-purple); overflow: hidden; }
        .burbuja { background: #F5F5F5; padding: 10px; border-radius: 12px; font-size: 0.9rem; flex: 1; height: 75px; overflow-y: auto; color: var(--navy); }

        #overlay-final { 
            position: absolute; inset: 0; display: none; flex-direction: column; 
            justify-content: center; align-items: center; background: rgba(16, 58, 87, 0.98); 
            z-index: 3000; color: white; padding: 20px;
        }

        .cuadro-resultados { 
            background: white; color: var(--navy); padding: 30px; 
            border-radius: 25px; width: 90%; max-width: 450px; text-align: center; 
        }

        .btn-finalizar { 
            background: var(--gold); border: none; padding: 18px 40px; 
            border-radius: 35px; font-weight: bold; cursor: pointer; 
            margin-top: 20px; color: var(--p-purple); font-size: 1.3rem; 
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 6</header>

    <div id="contenedor-juego">
        <div id="info-progreso" style="margin-bottom: 10px; font-weight: bold; color: var(--p-purple);">Situación 1 de 6</div>
        <div class="tarjeta-situacion">
            <p id="pregunta-texto" class="texto-situacion">Cargando situación...</p>
        </div>
        <div id="zona-opciones" class="zona-opciones"></div>
    </div>

    <div class="area-asistente">
        <div class="avatar-img"><img src="https://raw.githubusercontent.com/Anmameche/Rehabilidia/main/coterapeuta.png" style="width:100%"></div>
        <div class="burbuja" id="texto-asistente">Juan, ante un problema, siempre hay una opción más segura.</div>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h1 style="color: var(--p-purple); margin:0;">¡EXCELENTE TRABAJO!</h1>
            <p>Has practicado cómo tomar mejores decisiones hoy.</p>
            <div id="stats-final" style="font-size: 1.2rem; margin: 20px 0; font-weight: bold;"></div>
            <button class="btn-finalizar" onclick="guardarYSalir()">GUARDAR Y VOLVER</button>
        </div>
    </div>
</div>

<script>
    const situaciones = [
        {
            s: "Vas a cocinar y notas que el mango del sartén está muy caliente.",
            o: ["Lo agarro rápido", "Uso un guante o trapo seco", "Le echo agua fría"],
            c: 1,
            v: "Juan, usa siempre protección para no quemarte."
        },
        {
            s: "Terminas de usar la plancha. ¿Qué es lo más importante?",
            o: ["Dejarla sobre la ropa", "Desconectarla y guardarla en lugar seguro", "Dejarla prendida para luego"],
            c: 1,
            v: "Muy bien, desconectar los aparatos evita incendios."
        },
        {
            s: "Alguien que no conoces golpea la puerta y dice que viene a revisar el gas, pero no avisaron.",
            o: ["Lo dejo entrar", "Le pido que vuelva después", "No abro y llamo a un familiar o a la empresa"],
            c: 2,
            v: "Correcto Juan, la seguridad es lo primero, no abras a desconocidos."
        },
        {
            s: "Sientes un olor fuerte a gas en la cocina.",
            o: ["Prendo la luz para ver", "Abro las ventanas y cierro la llave del gas", "Me voy a dormir"],
            c: 1,
            v: "Exacto, ventilar y cerrar la llave es la decisión más segura."
        },
        {
            s: "Ves un charco de agua en el piso del pasillo.",
            o: ["Paso por encima", "Limpio el agua para no resbalar", "Espero a que se seque solo"],
            c: 1,
            v: "Bien pensado, evitar una caída es clave para tu salud."
        },
        {
            s: "Te ofrecen un medicamento nuevo que no te recetó tu médico.",
            o: ["Lo pruebo a ver si me sirve", "No lo tomo y consulto con mi médico", "Me tomo la mitad"],
            c: 1,
            v: "Nunca tomes remedios sin orden médica, Juan."
        }
    ];

    let indiceActual = 0;
    let aciertos = 0;
    let errores = 0;
    let bloqueado = false;

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
        document.getElementById('texto-asistente').innerText = t;
    }

    function iniciarSesion() {
        hablar("Hola Juan. Vamos a elegir la mejor solución para cada situación.");
        mostrarSituacion();
    }

    function mostrarSituacion() {
        bloqueado = false;
        const sit = situaciones[indiceActual];
        document.getElementById('info-progreso').innerText = `Situación ${indiceActual + 1} de ${situaciones.length}`;
        document.getElementById('pregunta-texto').innerText = sit.s;
        
        const zona = document.getElementById('zona-opciones');
        zona.innerHTML = "";
        
        sit.o.forEach((opc, i) => {
            const btn = document.createElement('button');
            btn.className = "btn-opcion";
            btn.innerText = opc;
            btn.onclick = () => validar(i, btn);
            zona.appendChild(btn);
        });
        hablar(sit.s);
    }

    function validar(idx, btn) {
        if(bloqueado) return;
        bloqueado = true;
        const sit = situaciones[indiceActual];

        if(idx === sit.c) {
            aciertos++;
            btn.classList.add('correcta');
            hablar(sit.v);
        } else {
            errores++;
            btn.classList.add('incorrecta');
            hablar("Esa no es la mejor opción. " + sit.v);
        }

        setTimeout(() => {
            indiceActual++;
            if(indiceActual < situaciones.length) {
                mostrarSituacion();
            } else {
                finalizar();
            }
        }, 3500);
    }

    function finalizar() {
        document.getElementById('overlay-final').style.display = 'flex';
        const ef = Math.round((aciertos / situaciones.length) * 100);
        document.getElementById('stats-final').innerHTML = `Aciertos: ${aciertos}<br>Eficacia: ${ef}%`;
        hablar("Muy bien Juan. Has terminado la sesión de hoy. Recuerda siempre pensar antes de actuar.");
    }

    function guardarYSalir() {
        const ef = Math.round((aciertos / situaciones.length) * 100);
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas",
            id_sesion: 6,
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
