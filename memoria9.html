<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memoria 9 - Juan: Observación y Detalle</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --light-green: #E8F5E9;
            --accent-gold: #FFD700;
            --white: #ffffff;
            --dark-green: #1B5E20;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; overflow: hidden; 
            background: #121212; 
            text-align: center; color: var(--dark-green); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        #contenedor-proporcional {
            width: 100vw; height: 100vh;
            max-width: 1200px; max-height: 800px;
            background: var(--light-green);
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        #cabecera { 
            background: var(--white); height: 12%; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 4px solid var(--accent-gold); flex-shrink: 0; padding: 0 15px;
        }

        #instruccion-box { 
            display: flex; align-items: center; font-weight: bold; 
            font-size: clamp(0.85rem, 2.2vw, 1.1rem); color: var(--dark-green); 
        }
        #instruccion-box img { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; border: 2px solid var(--primary-green); }

        #contenedor-principal { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-evenly; padding: 10px; 
        }

        #display-imagen { 
            max-width: 85%; 
            max-height: 45vh; 
            border: 6px solid var(--white); border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            display: none; object-fit: contain;
        }

        #timer { 
            font-size: 2.8rem; font-weight: bold; 
            color: var(--primary-green); 
            background: var(--white); padding: 5px 35px; border-radius: 40px; 
            border: 3px solid var(--accent-gold); display: none;
        }

        #quiz-box { 
            display: none; background: var(--white); padding: 25px; 
            border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 92%; max-width: 550px; 
        }

        .btn-opcion { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            font-size: 1.3rem; border: 2px solid #C8E6C9; 
            border-radius: 15px; cursor: pointer; background: #F1F8E9; 
            color: var(--dark-green); font-weight: bold;
        }

        #pantalla-transicion, #overlay-final { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            display:none; flex-direction:column; justify-content:center; 
            align-items:center; z-index:1000; background: var(--primary-green); color: var(--white);
        }

        .cuadro-resultados {
            background: var(--white); color: var(--dark-green); padding: 30px;
            border-radius: 25px; border: 6px solid var(--accent-gold); width: 85%;
        }
    </style>
</head>
<body onload="iniciarJuego()">

<div id="contenedor-proporcional">
    <div id="cabecera">
        <div id="instruccion-box">
            <img src="COTERAPEUTA.JPG">
            <span id="label-guia">Juan, observa los detalles de las imágenes porque luego responderemos unas preguntas.</span>
        </div>
    </div>

    <div id="contenedor-principal">
        <img id="display-imagen" src="">
        <div id="timer">10</div>
        
        <div id="quiz-box">
            <div id="pregunta-texto" style="font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;"></div>
            <div id="opciones-box"></div>
        </div>
    </div>

    <div id="pantalla-transicion">
        <h1 id="tit-nivel" style="background: var(--accent-gold); color: var(--dark-green); padding: 10px 40px; border-radius: 40px;"></h1>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h2 style="font-size: 2rem; margin: 0;">¡SESIÓN LOGRADA!</h2>
            <div id="resumen-stats" style="font-size: 1.6rem; margin: 20px 0; font-weight: bold;"></div>
            <button onclick="irAlMenu()" style="padding: 18px 40px; background: var(--accent-gold); border: none; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1.4rem; color: var(--dark-green); width: 100%;">FINALIZAR Y GUARDAR</button>
        </div>
    </div>
</div>

<script>
    let nivel = 1, rondaEnNivel = 1, aciertos = 0, errores = 0;
    let imagenesUsadasGlobal = [];
    let preguntasRondaActual = [];
    let preguntaIndice = 0;

    const configNivel = {
        1: { n: "INICIAL", r: [1, 10] },
        2: { n: "INTERMEDIO", r: [11, 20] },
        3: { n: "AVANZADO", r: [21, 30] }
    };

    const bancoPreguntas = {
        1: [{p:"¿El florero era de color azul?", o:["Sí","No","Era blanco"], r:0}, {p:"¿La manzana estaba en la esquina de la mesa?", o:["Sí","No","Estaba al centro"], r:1}, {p:"¿Qué tenía el vaso?", o:["Agua","Jugo","Vino"], r:0}, {p:"¿Habían flores moradas en el florero?", o:["Sí","No"], r:0}],
        2: [{p:"¿El perro estaba dormido?", o:["Sí","No"], r:0}, {p:"¿De qué color era la alfombra?", o:["Roja","Verde","Azul"], r:1}, {p:"¿Había un libro sobre la mesa?", o:["Sí","No"], r:0}, {p:"¿La manta estaba sobre la ventana?", o:["Sí","No"], r:1}],
        3: [{p:"¿En donde estaba el niño?", o:["En la casa","En el parque","En el colegio"], r:1}, {p:"¿De qué color era la camiseta del niño?", o:["Roja","Amarilla","Verde"], r:1}, {p:"¿El globo era de feliz cumpleaños?", o:["Sí","No"], r:1}, {p:"¿Habían más niños en la foto?", o:["Sí","No"], r:0}],
        4: [{p:"¿En la mesa había una taza?", o:["Sí","No"], r:0}, {p:"¿Cuántas materas habían?", o:["1","2","3"], r:2}, {p:"¿El gato estaba sobre la mesa?", o:["Sí","No"], r:1}],
        5: [{p:"¿El café estaba humeando?", o:["Sí","No"], r:0}, {p:"¿Qué había en el plato?", o:["Fruta","Pan con huevo","Tostadas"], r:1}, {p:"¿Había personas?", o:["Sí","No"], r:0}, {p:"¿En el plato había un tenedor?", o:["Sí","No"], r:1}],
        6: [{p:"¿Cuántas flores había en la ventana?", o:["2","3","5"], r:1}, {p:"¿Qué había sobre la mesa?", o:["Un libro y una taza","Solo platos","Nada"], r:0}, {p:"¿Las cortinas estaban abiertas?", o:["Sí","No"], r:0}, {p:"¿De qué color era la manta que había en la silla?", o:["Azul","Beige","Blanca"], r:1}],
        7: [{p:"¿En donde estaba el zapato?", o:["En el patio","En una cancha","En el closet"], r:1}, {p:"¿Qué decía la pelota de tenis?", o:["HEAD","Wilson","Penn"], r:0}, {p:"¿El zapato estaba amarrado?", o:["Sí","No"], r:0}, {p:"¿Los cordones eran blancos?", o:["Sí","No"], r:1}],
        8: [{p:"¿Como se llamaba el libro que estaba cerrado?", o:["La montaña mágica","Don Quijote","El Principito"], r:0}, {p:"¿Que había sobre el libro abierto?", o:["Un lápiz","Unas gafas","Una lupa"], r:1}, {p:"¿Se veían las montañas desde la ventana?", o:["Sí","No"], r:0}, {p:"¿El libro abierto tenía dibujos?", o:["Sí","No"], r:1}],
        9: [{p:"¿Atrás del regalo que había?", o:["Un florero","Una lámpara","Un cuadro"], r:0}, {p:"¿De qué ciudad era el regalo?", o:["Bogotá","Medellín","Cali"], r:1}, {p:"¿De qué color era el moño?", o:["Rojo","Dorado","Plata"], r:1}, {p:"¿El regalo tenía una decoración con flores?", o:["Sí","No"], r:1}],
        10: [{p:"¿De qué color era la bicicleta?", o:["Azul","Roja","Negra"], r:1}, {p:"¿Había un pato en la foto?", o:["Sí","No"], r:1}, {p:"¿El árbol tenía alguna fruta?", o:["Sí","No"], r:1}, {p:"¿Que había en el canasto de la bicicleta?", o:["Pan","Botella de agua y un bolso","Frutas"], r:1}],
        11: [{p:"¿Cuantas ollas había sobre la estufa?", o:["1","2","3"], r:1}, {p:"¿Que hora marcaba el reloj?", o:["8 am","10 am","12 pm"], r:1}, {p:"¿La jarra tenía jugo?", o:["Sí","No"], r:0}, {p:"¿Que fruta estaba en la tabla de picar?", o:["Pera","Mango","Manzana"], r:1}],
        12: [{p:"¿Que periódico estaba leyendo el señor?", o:["El Tiempo","El Espectador","El Mundo"], r:0}, {p:"¿De qué color era la camisa del niño?", o:["Verde","Amarilla","Azul"], r:1}, {p:"¿El señor tenía sombrero?", o:["Sí","No"], r:0}, {p:"¿Que habia en la banca junto al señor?", o:["Comida","Una taza y una Tula","Un libro"], r:1}],
        13: [{p:"¿Cuantos lápices habían?", o:["1","3","5"], r:1}, {p:"¿El computador estaba encendido?", o:["Sí","No"], r:0}, {p:"¿Qué decía la taza?", o:["Papá","Juan","Café"], r:0}, {p:"¿Había un cuadro de una planta?", o:["Sí","No"], r:1}],
        14: [{p:"¿De qué color era la toalla?", o:["Blanca","Roja","Azul"], r:1}, {p:"¿Cuantos cepillos de dientes habían?", o:["1","2","3"], r:0}, {p:"¿El grifo del agua estaba abierto?", o:["Sí","No"], r:1}, {p:"¿De que forma era el espejo?", o:["Cuadrado","Redondo","Triangular"], r:1}],
        15: [{p:"¿Las montañas del cuadro tenían nieve?", o:["Sí","No"], r:0}, {p:"¿Cuantos cojines habían?", o:["2","4","6"], r:1}, {p:"¿El gato estaba sobre la planta?", o:["Sí","No"], r:1}, {p:"¿Que habia en la mesa de centro?", o:["Taza y libro","Un florero","Nada"], r:0}],
        16: [{p:"¿De qué sabor era la mermelada?", o:["Mora","Fresa","Piña"], r:1}, {p:"¿La tetera estaba humeando?", o:["Sí","No"], r:0}, {p:"¿De qué color era la servilleta?", o:["Blanca","Azul","Roja"], r:1}, {p:"¿En el plato se veía algún alimento?", o:["Sí","No"], r:1}],
        17: [{p:"¿De qué color era el libro del medio?", o:["Verde","Rojo","Azul"], r:1}, {p:"¿El libro 'el alma de la montaña' de qué color era?", o:["Rojo","Azul","Gris"], r:1}, {p:"¿La cámara tenía el flash encendido?", o:["Sí","No"], r:1}, {p:"¿Como se llamaba el libro verde?", o:["El camino verde","Bosque","Sendas"], r:0}],
        18: [{p:"¿La regadera de qué color era?", o:["Verde","Roja","Amarilla"], r:1}, {p:"¿Las flores eran blancas y amarillas?", o:["Sí","No"], r:0}, {p:"¿Cuantos pares de guantes habían?", o:["1","2"], r:0}, {p:"¿En la mesa había una pala?", o:["Sí","No"], r:1}],
        19: [{p:"¿Cuantas almohadas habían?", o:["2","4","6"], r:1}, {p:"¿La ventana estaba cerrada?", o:["Sí","No"], r:1}, {p:"¿El libro sobre la mesa de noche estaba abierto?", o:["Sí","No"], r:0}, {p:"¿De qué color eran las pantuflas?", o:["Azules","Gris","Negras"], r:1}],
        20: [{p:"¿La camisa era blanca con rayas verdes?", o:["Sí","No"], r:1}, {p:"¿La botella de agua estaba vacía?", o:["Sí","No"], r:1}, {p:"¿De qué color era la correa de la cámara?", o:["Negra","Café","Gris"], r:1}, {p:"¿La prenda que había abajo de la camisa era roja?", o:["Sí","No"], r:1}],
        21: [{p:"¿La señora compró lechuga?", o:["Sí","No"], r:0}, {p:"¿Las manzanas estaban 4x2?", o:["Sí","No"], r:1}, {p:"¿De qué color era el delantal de la cajera?", o:["Verde","Azul","Blanco"], r:1}, {p:"¿La clienta tenía un sombrero?", o:["Sí","No"], r:1}],
        22: [{p:"¿Cuantas llantas habían apiladas?", o:["2","4","6"], r:1}, {p:"¿De que año era el calendario?", o:["2023","2024","2025"], r:1}, {p:"¿La caja de herramientas estaba cerrada?", o:["Sí","No"], r:1}, {p:"¿El extintor era amarillo?", o:["Sí","No"], r:1}],
        23: [{p:"¿Que figuras tenía el primer piso de la torta?", o:["Círculos","Estrellas","Corazones"], r:1}, {p:"¿Cuantos vasos habían?", o:["2","4","6"], r:1}, {p:"¿De qué color era el gorro de la niña?", o:["Rojo","Amarillo","Azul"], r:1}, {p:"¿Cuantos globos habían?", o:["3","5","8"], r:1}],
        24: [{p:"¿Como se llamaba la panadería?", o:["Panadería El Sol","La Luna","Pan Rico"], r:0}, {p:"¿Perro y señora iban en la misma dirección?", o:["Sí","No"], r:1}, {p:"¿El semáforo estaba en verde?", o:["Sí","No"], r:1}, {p:"¿El bus era del metro?", o:["Sí","No"], r:1}],
        25: [{p:"¿Cuantas manzanas habían?", o:["1","2","3"], r:1}, {p:"¿De qué color era la maleta del suelo?", o:["Roja","Amarilla","Azul"], r:1}, {p:"¿Cuantas materas habían?", o:["2","3","4"], r:1}, {p:"¿Cuantos escritorios habían?", o:["2","4","6"], r:1}],
        26: [{p:"¿La imagen de la pared era sistema esquelético?", o:["Sí","No"], r:1}, {p:"¿Cuantas plantas habían?", o:["1","2","3"], r:1}, {p:"¿La báscula era digital?", o:["Sí","No"], r:1}, {p:"¿Cuantos frascos había sobre el escritorio?", o:["2","3","5"], r:1}],
        27: [{p:"¿Había una lámpara de gas?", o:["Sí","No"], r:0}, {p:"¿Cuantos troncos había al rededor de la fogata?", o:["2","4","6"], r:0}, {p:"¿La carpa estaba cerrada?", o:["Sí","No"], r:1}, {p:"¿De qué color era la carpa?", o:["Verde","Azul","Gris"], r:1}],
        28: [{p:"¿El archivador estaba cerrado?", o:["Sí","No"], r:1}, {p:"¿Había alguna chiva?", o:["Sí","No"], r:0}, {p:"¿En la impresora habían documentos?", o:["Sí","No"], r:0}, {p:"¿La planta estaba en la estantería?", o:["Sí","No"], r:1}],
        29: [{p:"¿De qué color eran las sandalias?", o:["Rojas","Amarillas","Blancas"], r:1}, {p:"¿La sombrilla era roja y blanca?", o:["Sí","No"], r:1}, {p:"¿Cuantos veleros habían?", o:["1","2","3"], r:0}, {p:"¿De qué color era el balde de arena?", o:["Verde","Azul","Rojo"], r:1}],
        30: [{p:"¿De qué color era la lámpara?", o:["Azul","Verde","Gris"], r:1}, {p:"¿Cuantas personas habían?", o:["1","3","5"], r:1}, {p:"¿Había una escalera?", o:["Sí","No"], r:0}, {p:"¿En la biblioteca habían computadores?", o:["Sí","No"], r:1}]
    };

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES'; m.rate = 0.9;
        window.speechSynthesis.speak(m);
    }

    function iniciarJuego() { prepararNivel(); }

    function prepararNivel() {
        rondaEnNivel = 1;
        document.getElementById('tit-nivel').innerText = "NIVEL " + configNivel[nivel].n;
        document.getElementById('pantalla-transicion').style.display = 'flex';
        hablar("Juan, Nivel " + configNivel[nivel].n + ". Prepárate.");
        setTimeout(() => {
            document.getElementById('pantalla-transicion').style.display = 'none';
            iniciarObservacion();
        }, 3000);
    }

    function iniciarObservacion() {
        const c = configNivel[nivel];
        let idImg;
        do { idImg = Math.floor(Math.random() * (c.r[1] - c.r[0] + 1)) + c.r[0]; } 
        while (imagenesUsadasGlobal.includes(idImg));
        
        imagenesUsadasGlobal.push(idImg);
        escenaActual = idImg;

        let todas = [...bancoPreguntas[idImg]];
        preguntasRondaActual = todas.sort(() => 0.5 - Math.random()).slice(0, 2);
        preguntaIndice = 0;

        const imgDisplay = document.getElementById('display-imagen');
        imgDisplay.src = `mem9/imagen${idImg}.jpeg`; 
        imgDisplay.style.display = 'block';
        
        const timerTxt = document.getElementById('timer');
        timerTxt.style.display = 'block';
        let segundos = 10;
        timerTxt.innerText = segundos;

        hablar("Juan, observa los detalles de las imágenes porque luego responderemos unas preguntas.");

        let interval = setInterval(() => {
            segundos--;
            timerTxt.innerText = segundos;
            if(segundos <= 0) {
                clearInterval(interval);
                timerTxt.style.display = 'none';
                imgDisplay.style.display = 'none';
                lanzarPregunta();
            }
        }, 1000);
    }

    function lanzarPregunta() {
        const data = preguntasRondaActual[preguntaIndice];
        document.getElementById('pregunta-texto').innerText = data.p;
        const box = document.getElementById('opciones-box');
        box.innerHTML = "";
        
        data.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opcion';
            btn.innerText = opt;
            btn.onclick = () => verificar(index, data.r);
            box.appendChild(btn);
        });

        document.getElementById('quiz-box').style.display = 'block';
        hablar(data.p);
    }

    function verificar(elegido, correcto) {
        if(elegido === correcto) { aciertos++; hablar("¡Excelente Juan!"); } 
        else { errores++; hablar("No era así."); }
        
        setTimeout(() => {
            document.getElementById('quiz-box').style.display = 'none';
            if(preguntaIndice < 1) {
                preguntaIndice++;
                lanzarPregunta();
            } else {
                if(rondaEnNivel < 3) {
                    rondaEnNivel++;
                    iniciarObservacion();
                } else if(nivel < 3) {
                    nivel++;
                    prepararNivel();
                } else {
                    finalizarSesion();
                }
            }
        }, 1200);
    }

    function finalizarSesion() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100);
        document.getElementById('resumen-stats').innerHTML = `Aciertos: ${aciertos}<br>Errores: ${errores}<br>Eficacia: ${ef}%`;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("Muy bien Juan, hemos terminado la sesión de hoy.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100);
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Memoria", id_sesion: 9,      
            aciertos: aciertos, errores: errores,
            eficacia: ef + "%"
        };
        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datosSesion);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        window.location.href = "memoria_sesiones.html";
    }
</script>
</body>
</html>
