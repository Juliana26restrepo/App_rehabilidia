<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memoria 9 - Juan: Observación y Detalle</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --light-green: #E8F5E9;
            --accent-gold: #FFD700;
            --white: #ffffff;
            --dark-green: #1B5E20;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; overflow: hidden; 
            background: #121212; 
            text-align: center; color: var(--dark-green); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        #contenedor-proporcional {
            width: 100vw; height: 100vh;
            max-width: 1200px; max-height: 800px;
            background: var(--light-green);
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #cabecera { 
            background: var(--white); height: 12%; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 4px solid var(--accent-gold); flex-shrink: 0; 
        }

        #instruccion-box { 
            display: flex; align-items: center; font-weight: bold; 
            font-size: clamp(0.9rem, 2.5vw, 1.3rem); color: var(--dark-green); 
        }
        #instruccion-box img { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; border: 2px solid var(--primary-green); }

        #contenedor-principal { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px; 
            position: relative; overflow: hidden;
        }

        #display-imagen { 
            max-width: 90%; max-height: 65vh; 
            border: 8px solid var(--white); border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            display: none; object-fit: contain;
        }

        #timer { 
            font-size: clamp(2rem, 6vw, 3.5rem); font-weight: bold; 
            color: var(--primary-green); margin-top: 15px; display: none; 
            background: var(--white); padding: 5px 40px; border-radius: 50px; 
            border: 3px solid var(--accent-gold); 
        }

        #quiz-box { 
            display: none; background: var(--white); padding: 25px; 
            border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 90%; max-width: 600px; 
        }

        .btn-opcion { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            font-size: clamp(1rem, 2vw, 1.4rem); border: 3px solid #C8E6C9; 
            border-radius: 15px; cursor: pointer; background: #F1F8E9; 
            color: var(--dark-green); font-weight: bold; transition: 0.2s;
            touch-action: manipulation;
        }
        .btn-opcion:active { transform: scale(0.98); background: #C8E6C9; }

        #pantalla-transicion, #overlay-final { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            display:none; flex-direction:column; justify-content:center; 
            align-items:center; z-index:1000; padding: 20px;
        }
        #pantalla-transicion { background: var(--primary-green); color: var(--white); }
        #overlay-final { background: rgba(27, 94, 32, 0.98); color: var(--white); }

        .cuadro-resultados {
            background: var(--white); color: var(--dark-green); padding: 30px;
            border-radius: 25px; border: 6px solid var(--accent-gold);
            width: 90%; max-width: 500px; text-align: center;
        }

        .stat-line { 
            display: flex; justify-content: space-between; 
            font-size: 1.5rem; margin: 10px 0; padding-bottom: 5px;
            border-bottom: 2px solid #eee;
        }

        .btn-final {
            padding: 15px 40px; background: var(--accent-gold); color: var(--dark-green); 
            border-radius: 15px; font-size: 1.4rem; border:none; cursor:pointer; 
            font-weight:bold; width: 100%; margin-top: 10px;
        }
    </style>
</head>
<body onload="iniciarJuego()">

<div id="contenedor-proporcional">
    <div id="cabecera">
        <div id="instruccion-box">
            <img src="COTERAPEUTA.JPG">
            <span id="label-guia">Juan, observa la escena</span>
        </div>
    </div>

    <div id="contenedor-principal">
        <img id="display-imagen" src="">
        <div id="timer">0</div>
        
        <div id="quiz-box">
            <div id="pregunta-texto" style="font-size: 1.6rem; font-weight: bold; margin-bottom: 20px;"></div>
            <div id="opciones-box"></div>
        </div>
    </div>

    <div id="pantalla-transicion">
        <h1 id="tit-nivel" style="background: var(--accent-gold); color: var(--dark-green); padding: 10px 40px; border-radius: 50px;"></h1>
        <p id="desc-nivel" style="font-size: 1.6rem; margin-top: 20px; width: 85%;"></p>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h1 style="color: var(--primary-green); margin: 0;">¡SESIÓN LOGRADA!</h1>
            <div id="resumen-stats" style="margin: 20px 0;"></div>
            <p style="font-weight: bold; margin-bottom: 25px;">“Tu mente recuerda más de lo que imaginas, sigue practicando”</p>
            <button class="btn-final" onpointerdown="irAlMenu()">FINALIZAR Y GUARDAR</button>
        </div>
    </div>
</div>

<script>
    let nivel = 1, rondaEnNivel = 1, aciertos = 0, errores = 0, escenaActual = null;
    let imagenesUsadasGlobal = [];
    let preguntasRondaActual = [];
    let preguntaIndice = 0;

    const configNivel = {
        1: { n: "Bajo", t: 15, r: [1, 10] },
        2: { n: "Medio", t: 25, r: [11, 20] },
        3: { n: "Alto", t: 35, r: [21, 30] }
    };

    const bancoPreguntas = {
        1: [{p:"¿El florero era de color azul?", o:["Sí","No"], r:0}, {p:"¿La manzana estaba en la esquina de la mesa?", o:["Sí","No"], r:1}, {p:"¿Qué tenía el vaso?", o:["Agua","Jugo","Vino"], r:0}, {p:"¿Habían flores moradas en el florero?", o:["Sí","No"], r:0}],
        2: [{p:"¿El perro estaba dormido?", o:["Sí","No"], r:0}, {p:"¿De qué color era la alfombra?", o:["Roja","Verde","Azul"], r:1}, {p:"¿Había un libro sobre la mesa?", o:["Sí","No"], r:0}, {p:"¿La manta estaba sobre la ventana?", o:["Sí","No"], r:1}],
        3: [{p:"¿En dónde estaba el niño?", o:["En la casa","En el parque"], r:1}, {p:"¿De qué color era la camiseta del niño?", o:["Roja","Amarilla","Verde"], r:1}, {p:"¿El globo era de feliz cumpleaños?", o:["Sí","No"], r:1}, {p:"¿Habían más niños en la foto?", o:["Sí","No"], r:0}],
        4: [{p:"¿En la mesa había una taza?", o:["Sí","No"], r:0}, {p:"¿Cuántas materas habían?", o:["1","2","3"], r:2}, {p:"¿El gato estaba sobre la mesa?", o:["Sí","No"], r:1}, {p:"¿La mesa era de madera?", o:["Sí","No"], r:0}],
        5: [{p:"¿El café estaba humeando?", o:["Sí","No"], r:0}, {p:"¿Qué había en el plato?", o:["Fruta","Pan con huevo","Tostadas"], r:1}, {p:"¿Había personas?", o:["Sí","No"], r:0}, {p:"¿En el plato había un tenedor?", o:["Sí","No"], r:1}],
        6: [{p:"¿Cuántas flores había en la ventana?", o:["2","3","5"], r:1}, {p:"¿Qué había sobre la mesa?", o:["Platos","Un libro y una taza","Nada"], r:1}, {p:"¿Las cortinas estaban abiertas?", o:["Sí","No"], r:0}, {p:"¿Color de la manta en la silla?", o:["Azul","Beige","Verde"], r:1}],
        7: [{p:"¿En dónde estaba el zapato?", o:["En el closet","En una cancha"], r:1}, {p:"¿Qué decía la pelota de tenis?", o:["HEAD","Wilson","Penn"], r:0}, {p:"¿El zapato estaba amarrado?", o:["Sí","No"], r:0}, {p:"¿Los cordones eran blancos?", o:["Sí","No"], r:1}],
        8: [{p:"¿Nombre del libro cerrado?", o:["La montaña mágica","Don Quijote"], r:0}, {p:"¿Qué había sobre el libro abierto?", o:["Un lápiz","Unas gafas","Una lupa"], r:1}, {p:"¿Se veían las montañas por la ventana?", o:["Sí","No"], r:0}, {p:"¿El libro abierto tenía dibujos?", o:["Sí","No"], r:1}],
        9: [{p:"¿Atrás del regalo qué había?", o:["Un florero","Una lámpara"], r:0}, {p:"¿De qué ciudad era el regalo?", o:["Bogotá","Medellín","Cali"], r:1}, {p:"¿De qué color era el moño?", o:["Rojo","Dorado","Plata"], r:1}, {p:"¿El regalo tenía flores?", o:["Sí","No"], r:1}],
        10: [{p:"¿De qué color era la bicicleta?", o:["Azul","Roja","Negra"], r:1}, {p:"¿Había un pato en la foto?", o:["Sí","No"], r:1}, {p:"¿El árbol tenía alguna fruta?", o:["Sí","No"], r:1}, {p:"¿Qué había en el canasto?", o:["Pan","Botella de agua y bolso","Fruta"], r:1}],
        11: [{p:"¿Cuántas ollas había en la estufa?", o:["1","2","3"], r:1}, {p:"¿Qué hora marcaba el reloj?", o:["8 am","10 am","12 pm"], r:1}, {p:"¿La jarra tenía jugo?", o:["Sí","No"], r:0}, {p:"¿Qué fruta había en la tabla?", o:["Manzana","Mango","Pera"], r:1}],
        12: [{p:"¿Qué periódico leía el señor?", o:["El Tiempo","El Espectador"], r:0}, {p:"¿Color de la camisa del niño?", o:["Verde","Amarilla","Azul"], r:1}, {p:"¿El señor tenía sombrero?", o:["Sí","No"], r:0}, {p:"¿Qué había en la banca?", o:["Periódico","Taza y Tula","Comida"], r:1}],
        13: [{p:"¿Cuántos lápices habían?", o:["1","3","5"], r:1}, {p:"¿El computador estaba encendido?", o:["Sí","No"], r:0}, {p:"¿Qué decía la taza?", o:["Papá","Juan","Café"], r:0}, {p:"¿Había un cuadro de una planta?", o:["Sí","No"], r:1}],
        14: [{p:"¿De qué color era la toalla?", o:["Blanca","Roja","Azul"], r:1}, {p:"¿Cuántos cepillos de dientes había?", o:["1","2","3"], r:0}, {p:"¿El grifo estaba abierto?", o:["Sí","No"], r:1}, {p:"¿De qué forma era el espejo?", o:["Cuadrado","Redondo"], r:1}],
        15: [{p:"¿Las montañas tenían nieve?", o:["Sí","No"], r:0}, {p:"¿Cuántos cojines habían?", o:["2","4","6"], r:1}, {p:"¿El gato estaba sobre la planta?", o:["Sí","No"], r:1}, {p:"¿Qué había en la mesa de centro?", o:["Taza y libro","Jarrón","Cenicero"], r:0}],
        16: [{p:"¿De qué sabor era la mermelada?", o:["Mora","Fresa","Piña"], r:1}, {p:"¿La tetera estaba humeando?", o:["Sí","No"], r:0}, {p:"¿De qué color era la servilleta?", o:["Blanca","Azul","Roja"], r:1}, {p:"¿En el plato había alimento?", o:["Sí","No"], r:1}],
        17: [{p:"¿Color del libro del medio?", o:["Verde","Rojo","Azul"], r:1}, {p:"¿Color de 'El alma de la montaña'?", o:["Rojo","Azul","Gris"], r:1}, {p:"¿La cámara tenía el flash encendido?", o:["Sí","No"], r:1}, {p:"¿Nombre del libro verde?", o:["El camino verde","Bosque"], r:0}],
        18: [{p:"¿Color de la regadera?", o:["Verde","Roja","Amarilla"], r:1}, {p:"¿Las flores eran blancas/amarillas?", o:["Sí","No"], r:0}, {p:"¿Cuántos pares de guantes había?", o:["1","2"], r:0}, {p:"¿En la mesa había una pala?", o:["Sí","No"], r:1}],
        19: [{p:"¿Cuántas almohadas habían?", o:["2","4","5"], r:1}, {p:"¿La ventana estaba cerrada?", o:["Sí","No"], r:1}, {p:"¿Libro de mesa de noche abierto?", o:["Sí","No"], r:0}, {p:"¿Color de las pantuflas?", o:["Azules","Gris","Café"], r:1}],
        20: [{p:"¿Camisa blanca rayas verdes?", o:["Sí","No"], r:1}, {p:"¿La botella de agua estaba vacía?", o:["Sí","No"], r:1}, {p:"¿Color correa de la cámara?", o:["Negra","Café","Gris"], r:1}, {p:"¿Prenda bajo la camisa era roja?", o:["Sí","No"], r:1}],
        21: [{p:"¿La señora compró lechuga?", o:["Sí","No"], r:0}, {p:"¿Las manzanas estaban 4x2?", o:["Sí","No"], r:1}, {p:"¿Color del delantal de la cajera?", o:["Verde","Azul","Blanco"], r:1}, {p:"¿La clienta tenía sombrero?", o:["Sí","No"], r:1}],
        22: [{p:"¿Cuántas llantas apiladas habían?", o:["2","4","6"], r:1}, {p:"¿De qué año era el calendario?", o:["2023","2024","2025"], r:1}, {p:"¿Caja de herramientas cerrada?", o:["Sí","No"], r:1}, {p:"¿El extintor era amarillo?", o:["Sí","No"], r:1}],
        23: [{p:"¿Figuras del 1er piso de torta?", o:["Círculos","Estrellas","Flores"], r:1}, {p:"¿Cuántos vasos habían?", o:["2","4","6"], r:1}, {p:"¿Color gorro niña camisa rosa?", o:["Rojo","Amarillo","Azul"], r:1}, {p:"¿Cuántos globos habían?", o:["3","5","8"], r:1}],
        24: [{p:"¿Nombre de la panadería?", o:["Panadería El Sol","La Luna"], r:0}, {p:"¿Perro y señora misma dirección?", o:["Sí","No"], r:1}, {p:"¿El semáforo estaba en verde?", o:["Sí","No"], r:1}, {p:"¿El bus era del Metro?", o:["Sí","No"], r:1}],
        25: [{p:"¿Cuántas manzanas habían?", o:["1","2","3"], r:1}, {p:"¿Color maleta en el suelo?", o:["Roja","Amarilla","Azul"], r:1}, {p:"¿Cuántas materas habían?", o:["2","3","4"], r:1}, {p:"¿Cuántos escritorios de alumnos?", o:["2","4","6"], r:1}],
        26: [{p:"¿Imagen pared es sist. esquelético?", o:["Sí","No"], r:1}, {p:"¿Cuántas plantas habían?", o:["1","2","3"], r:1}, {p:"¿La báscula era digital?", o:["Sí","No"], r:1}, {p:"¿Cuántos frascos en escritorio?", o:["2","3","5"], r:1}],
        27: [{p:"¿Había una lámpara de gas?", o:["Sí","No"], r:0}, {p:"¿Troncos alrededor de fogata?", o:["2","4","6"], r:0}, {p:"¿La carpa estaba cerrada?", o:["Sí","No"], r:1}, {p:"¿De qué color era la carpa?", o:["Verde","Azul","Roja"], r:1}],
        28: [{p:"¿El archivador estaba cerrado?", o:["Sí","No"], r:1}, {p:"¿Había alguna chiva?", o:["Sí","No"], r:0}, {p:"¿Impresora con documentos?", o:["Sí","No"], r:0}, {p:"¿Planta en la estantería?", o:["Sí","No"], r:1}],
        29: [{p:"¿De qué color eran las sandalias?", o:["Rojas","Amarillas","Azules"], r:1}, {p:"¿Sombrilla roja y blanca?", o:["Sí","No"], r:1}, {p:"¿Cuántos veleros habían?", o:["1","2","3"], r:0}, {p:"¿Color del balde de arena?", o:["Verde","Azul","Rojo"], r:1}],
        30: [{p:"¿De qué color era la lámpara?", o:["Azul","Verde","Gris"], r:1}, {p:"¿Cuántas personas habían?", o:["1","3","5"], r:1}, {p:"¿Había una escalera?", o:["Sí","No"], r:0}, {p:"¿Biblioteca con computadores?", o:["Sí","No"], r:1}]
    };

    function hablar(t, cb) { 
        window.speechSynthesis.cancel(); 
        const m = new SpeechSynthesisUtterance(t); 
        m.lang = 'es-ES'; m.rate = 0.9; 
        if(cb) m.onend = cb; 
        window.speechSynthesis.speak(m); 
    }

    function iniciarJuego() { prepararNivel(); }

    function prepararNivel() {
        rondaEnNivel = 1;
        const c = configNivel[nivel];
        document.getElementById('tit-nivel').innerText = "NIVEL " + c.n.toUpperCase();
        document.getElementById('desc-nivel').innerText = "Juan, observa bien los detalles.";
        document.getElementById('pantalla-transicion').style.display = 'flex';
        
        hablar(`Juan, Nivel ${c.n}. Observa con atención.`, () => {
            setTimeout(() => {
                document.getElementById('pantalla-transicion').style.display = 'none';
                iniciarObservacion();
            }, 2500);
        });
    }

    function iniciarObservacion() {
        const c = configNivel[nivel];
        let idImg;
        do {
            idImg = Math.floor(Math.random() * (c.r[1] - c.r[0] + 1)) + c.r[0];
        } while (imagenesUsadasGlobal.includes(idImg));
        
        imagenesUsadasGlobal.push(idImg);
        escenaActual = idImg;
        
        // Seleccionar 2 preguntas aleatorias del banco de 4
        let todas = [...bancoPreguntas[idImg]];
        preguntasRondaActual = todas.sort(() => 0.5 - Math.random()).slice(0, 2);
        preguntaIndice = 0;

        const imgDisplay = document.getElementById('display-imagen');
        imgDisplay.src = `mem9/imagen${idImg}.jpeg`; 
        imgDisplay.style.display = 'block';
        
        const timerTxt = document.getElementById('timer');
        timerTxt.style.display = 'block';
        let segundos = c.t;
        timerTxt.innerText = segundos;

        let interval = setInterval(() => {
            segundos--;
            timerTxt.innerText = segundos;
            if(segundos <= 0) {
                clearInterval(interval);
                timerTxt.style.display = 'none';
                imgDisplay.style.display = 'none';
                lanzarPregunta();
            }
        }, 1000);
    }

    function lanzarPregunta() {
        const data = preguntasRondaActual[preguntaIndice];
        document.getElementById('pregunta-texto').innerText = data.p;
        const box = document.getElementById('opciones-box');
        box.innerHTML = "";
        
        data.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opcion';
            btn.innerText = opt;
            btn.onpointerdown = (e) => { e.preventDefault(); verificar(index, data.r); };
            box.appendChild(btn);
        });

        document.getElementById('quiz-box').style.display = 'block';
        hablar(data.p);
    }

    function verificar(elegido, correcto) {
        if(elegido === correcto) { aciertos++; hablar("¡Muy bien!"); } 
        else { errores++; hablar("No era así."); }
        
        setTimeout(() => {
            document.getElementById('quiz-box').style.display = 'none';
            if(preguntaIndice < 1) { // Son 2 preguntas por imagen
                preguntaIndice++;
                lanzarPregunta();
            } else {
                if(rondaEnNivel < 3) {
                    rondaEnNivel++;
                    iniciarObservacion();
                } else if(nivel < 3) {
                    nivel++;
                    prepararNivel();
                } else {
                    finalizarSesion();
                }
            }
        }, 1500);
    }

    function finalizarSesion() {
        const ef = Math.round((aciertos / (aciertos + errores || 1)) * 100);
        document.getElementById('resumen-stats').innerHTML = `
            <div class="stat-line"><span>Aciertos:</span> <b>${aciertos}</b></div>
            <div class="stat-line"><span>Errores:</span> <b>${errores}</b></div>
            <div class="stat-line" style="color:var(--primary-green); border:none; font-size:1.8rem;">
                <span>Eficacia:</span> <b>${ef}%</b>
            </div>
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("Sesión terminada, Juan. Buen trabajo.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + errores || 1)) * 100);
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Memoria", 
            id_sesion: 9,      
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || []; 
        if (!Array.isArray(historial)) historial = []; 
        historial.push(datosSesion); 
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial)); 

        window.location.href = "memoria_sesiones.html";
    }
</script>
</body>
</html>
