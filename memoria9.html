<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memoria 9 - Juan: Observación y Detalle</title>
    <style>
        :root {
            --primary-green: #2E7D32;
            --light-green: #E8F5E9;
            --accent-gold: #FFD700;
            --white: #ffffff;
            --dark-green: #1B5E20;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; overflow: hidden; 
            background: #121212; 
            text-align: center; color: var(--dark-green); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        #contenedor-proporcional {
            width: 100vw; height: 100vh;
            max-width: 1200px; max-height: 800px;
            background: var(--light-green);
            position: relative;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        #cabecera { 
            background: var(--white); height: 10%; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 4px solid var(--accent-gold); flex-shrink: 0; 
        }

        #instruccion-box { 
            display: flex; align-items: center; font-weight: bold; 
            font-size: clamp(0.9rem, 2.5vw, 1.2rem); color: var(--dark-green); 
        }
        #instruccion-box img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; }

        #contenedor-principal { 
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-evenly; padding: 10px; 
        }

        #display-imagen { 
            max-width: 85%; 
            max-height: 55vh; /* Tamaño reducido para ver el tiempo abajo */
            border: 6px solid var(--white); border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            display: none; object-fit: contain;
        }

        #timer { 
            font-size: 2.5rem; font-weight: bold; 
            color: var(--primary-green); 
            background: var(--white); padding: 5px 30px; border-radius: 30px; 
            border: 3px solid var(--accent-gold); display: none;
        }

        #quiz-box { 
            display: none; background: var(--white); padding: 20px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 90%; max-width: 550px; 
        }

        .btn-opcion { 
            display: block; width: 100%; padding: 12px; margin: 8px 0; 
            font-size: 1.2rem; border: 2px solid #C8E6C9; 
            border-radius: 12px; cursor: pointer; background: #F1F8E9; 
            color: var(--dark-green); font-weight: bold;
        }

        /* Capas finales */
        #pantalla-transicion, #overlay-final { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            display:none; flex-direction:column; justify-content:center; 
            align-items:center; z-index:1000; background: var(--primary-green); color: var(--white);
        }

        .cuadro-resultados {
            background: var(--white); color: var(--dark-green); padding: 25px;
            border-radius: 20px; border: 5px solid var(--accent-gold); width: 85%;
        }
    </style>
</head>
<body onload="iniciarJuego()">

<div id="contenedor-proporcional">
    <div id="cabecera">
        <div id="instruccion-box">
            <img src="COTERAPEUTA.JPG">
            <span id="label-guia">Juan, fíjate bien en los detalles...</span>
        </div>
    </div>

    <div id="contenedor-principal">
        <img id="display-imagen" src="">
        <div id="timer">10</div>
        
        <div id="quiz-box">
            <div id="pregunta-texto" style="font-size: 1.4rem; font-weight: bold; margin-bottom: 15px;"></div>
            <div id="opciones-box"></div>
        </div>
    </div>

    <div id="pantalla-transicion">
        <h1 id="tit-nivel" style="background: var(--accent-gold); color: var(--dark-green); padding: 10px 30px; border-radius: 30px;"></h1>
        <p style="font-size: 1.4rem;">¡Prepárate!</p>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h2>¡Sesión Completada!</h2>
            <div id="resumen-stats" style="font-size: 1.3rem; margin-bottom: 20px;"></div>
            <button onclick="irAlMenu()" style="padding: 15px 30px; background: var(--accent-gold); border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">FINALIZAR Y GUARDAR</button>
        </div>
    </div>
</div>

<script>
    let nivel = 1, rondaEnNivel = 1, aciertos = 0, errores = 0;
    let imagenesUsadasGlobal = [];
    let preguntasRondaActual = [];
    let preguntaIndice = 0;

    const configNivel = {
        1: { n: "Inicial", r: [1, 10] },
        2: { n: "Intermedio", r: [11, 20] },
        3: { n: "Avanzado", r: [21, 30] }
    };

    // Banco actualizado con 3 opciones por pregunta
    const bancoPreguntas = {
        1: [{p:"¿El florero era azul?", o:["Sí, azul","No, era rojo","Era transparente"], r:0}, {p:"¿Qué tenía el vaso?", o:["Agua","Jugo de naranja","Vino tinto"], r:0}],
        2: [{p:"¿Color de la alfombra?", o:["Verde","Gris","Café"], r:0}, {p:"¿Había un libro en la mesa?", o:["Sí","No","No se veía la mesa"], r:0}],
        3: [{p:"¿Dónde estaba el niño?", o:["En la casa","En el parque","En la escuela"], r:1}, {p:"¿Color de su camiseta?", o:["Azul","Amarilla","Verde"], r:1}],
        4: [{p:"¿Cuántas materas había?", o:["1","2","3"], r:2}, {p:"¿El gato estaba en la mesa?", o:["Sí","No","No había gato"], r:1}],
        5: [{p:"¿Qué había en el plato?", o:["Fruta","Pan con huevo","Tostadas"], r:1}, {p:"¿Había personas?", o:["Sí","No","Solo se veía la mano"], r:0}],
        6: [{p:"¿Flores en la ventana?", o:["2 flores","3 flores","Ninguna"], r:1}, {p:"¿Color de la manta?", o:["Blanca","Beige","Azul"], r:1}],
        7: [{p:"¿Marca de la pelota?", o:["HEAD","Wilson","Penn"], r:0}, {p:"¿Cordones blancos?", o:["Sí","No, eran negros","No tenía cordones"], r:1}],
        8: [{p:"¿Libro sobre el abierto?", o:["Un lápiz","Gafas","Una taza"], r:1}, {p:"¿Había dibujos?", o:["Sí","No","Solo en la portada"], r:1}],
        9: [{p:"¿Ciudad del regalo?", o:["Bogotá","Medellín","Cali"], r:1}, {p:"¿Color del moño?", o:["Rojo","Dorado","Plateado"], r:1}],
        10: [{p:"¿Color de la bicicleta?", o:["Azul","Roja","Verde"], r:1}, {p:"¿Qué había en el canasto?", o:["Flores","Botella y bolso","Fruta"], r:1}],
        11: [{p:"¿Ollas en la estufa?", o:["Una","Dos","Tres"], r:1}, {p:"¿Qué fruta era?", o:["Pera","Mango","Manzana"], r:1}],
        12: [{p:"¿Qué leía el señor?", o:["El Tiempo","El Espectador","Una revista"], r:0}, {p:"¿Tenía sombrero?", o:["Sí","No","Lo tenía en la mano"], r:0}],
        13: [{p:"¿Cuántos lápices?", o:["1 lápiz","3 lápices","5 lápices"], r:1}, {p:"¿Qué decía la taza?", o:["Papá","Juan","Café"], r:0}],
        14: [{p:"¿Color de la toalla?", o:["Blanca","Roja","Verde"], r:1}, {p:"¿Forma del espejo?", o:["Cuadrado","Redondo","Ovalado"], r:1}],
        15: [{p:"¿Montañas con nieve?", o:["Sí","No","No se veían montañas"], r:0}, {p:"¿Cuántos cojines?", o:["2","4","5"], r:1}],
        16: [{p:"¿Sabor mermelada?", o:["Mora","Fresa","Durazno"], r:1}, {p:"¿Color servilleta?", o:["Blanca","Azul","Cuadros"], r:1}],
        17: [{p:"¿Libro del medio?", o:["Verde","Rojo","Azul"], r:1}, {p:"¿Flash encendido?", o:["Sí","No","La cámara estaba tapada"], r:1}],
        18: [{p:"¿Color regadera?", o:["Verde","Roja","Azul"], r:1}, {p:"¿Pares de guantes?", o:["1 par","2 pares","Ninguno"], r:0}],
        19: [{p:"¿Cuántas almohadas?", o:["2","4","6"], r:1}, {p:"¿Color pantuflas?", o:["Azules","Gris","Negras"], r:1}],
        20: [{p:"¿Botella de agua vacía?", o:["Sí","No, llena","A la mitad"], r:1}, {p:"¿Color correa cámara?", o:["Negra","Café","Azul"], r:1}],
        21: [{p:"¿Compró lechuga?", o:["Sí","No","Compró tomates"], r:0}, {p:"¿Color del delantal?", o:["Blanco","Azul","Rojo"], r:1}],
        22: [{p:"¿Año del calendario?", o:["2023","2024","2025"], r:1}, {p:"¿Color extintor?", o:["Rojo","Amarillo","Verde"], r:0}],
        23: [{p:"¿Piso 1 de la torta?", o:["Círculos","Estrellas","Corazones"], r:1}, {p:"¿Cuántos globos?", o:["3","5","7"], r:1}],
        24: [{p:"¿Nombre panadería?", o:["El Sol","La Luna","Pan Rico"], r:0}, {p:"¿Semáforo en verde?", o:["Sí","No, rojo","Estaba apagado"], r:1}],
        25: [{p:"¿Color de la maleta?", o:["Azul","Amarilla","Verde"], r:1}, {p:"¿Cuántos escritorios?", o:["2","4","5"], r:1}],
        26: [{p:"¿Plantas en la sala?", o:["1 planta","2 plantas","Ninguna"], r:1}, {p:"¿Frascos en mesa?", o:["2","3","4"], r:1}],
        27: [{p:"¿Lámpara de gas?", o:["Sí","No","Era una linterna"], r:0}, {p:"¿Color de la carpa?", o:["Verde","Azul","Gris"], r:1}],
        28: [{p:"¿Había una chiva?", o:["Sí","No","Era un camión"], r:0}, {p:"¿Planta en estante?", o:["Sí","No","Estaba en el suelo"], r:1}],
        29: [{p:"¿Color de sandalias?", o:["Rojas","Amarillas","Blancas"], r:1}, {p:"¿Color del balde?", o:["Verde","Azul","Rojo"], r:1}],
        30: [{p:"¿Personas en escena?", o:["1 persona","3 personas","5 personas"], r:1}, {p:"¿Había computadores?", o:["Sí","No","Solo uno"], r:1}]
    };

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES'; m.rate = 0.9;
        window.speechSynthesis.speak(m);
    }

    function iniciarJuego() { prepararNivel(); }

    function prepararNivel() {
        rondaEnNivel = 1;
        document.getElementById('tit-nivel').innerText = "Nivel " + configNivel[nivel].n;
        document.getElementById('pantalla-transicion').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('pantalla-transicion').style.display = 'none';
            iniciarObservacion();
        }, 2000);
    }

    function iniciarObservacion() {
        const c = configNivel[nivel];
        let idImg;
        do { idImg = Math.floor(Math.random() * (c.r[1] - c.r[0] + 1)) + c.r[0]; } 
        while (imagenesUsadasGlobal.includes(idImg));
        
        imagenesUsadasGlobal.push(idImg);
        escenaActual = idImg;

        // Seleccionar 2 preguntas al azar
        let todas = [...bancoPreguntas[idImg]];
        preguntasRondaActual = todas.sort(() => 0.5 - Math.random()).slice(0, 2);
        preguntaIndice = 0;

        const imgDisplay = document.getElementById('display-imagen');
        imgDisplay.src = `mem9/imagen${idImg}.jpeg`; 
        imgDisplay.style.display = 'block';
        
        const timerTxt = document.getElementById('timer');
        timerTxt.style.display = 'block';
        let segundos = 10; // Tiempo ajustado a 10 segundos
        timerTxt.innerText = segundos;

        let interval = setInterval(() => {
            segundos--;
            timerTxt.innerText = segundos;
            if(segundos <= 0) {
                clearInterval(interval);
                timerTxt.style.display = 'none';
                imgDisplay.style.display = 'none';
                lanzarPregunta();
            }
        }, 1000);
    }

    function lanzarPregunta() {
        const data = preguntasRondaActual[preguntaIndice];
        document.getElementById('pregunta-texto').innerText = data.p;
        const box = document.getElementById('opciones-box');
        box.innerHTML = "";
        
        data.o.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opcion';
            btn.innerText = opt;
            btn.onclick = () => verificar(index, data.r);
            box.appendChild(btn);
        });

        document.getElementById('quiz-box').style.display = 'block';
        hablar(data.p);
    }

    function verificar(elegido, correcto) {
        if(elegido === correcto) { aciertos++; hablar("¡Excelente!"); } 
        else { errores++; hablar("Cerca, pero no."); }
        
        setTimeout(() => {
            document.getElementById('quiz-box').style.display = 'none';
            if(preguntaIndice < 1) {
                preguntaIndice++;
                lanzarPregunta();
            } else {
                if(rondaEnNivel < 3) {
                    rondaEnNivel++;
                    iniciarObservacion();
                } else if(nivel < 3) {
                    nivel++;
                    prepararNivel();
                } else {
                    finalizarSesion();
                }
            }
        }, 1000);
    }

    function finalizarSesion() {
        document.getElementById('resumen-stats').innerHTML = `Aciertos: ${aciertos}<br>Errores: ${errores}`;
        document.getElementById('overlay-final').style.display = 'flex';
    }

    function irAlMenu() {
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Memoria", id_sesion: 9,      
            aciertos: aciertos, errores: errores,
            eficacia: Math.round((aciertos / (aciertos + errores)) * 100) + "%"
        };
        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datosSesion);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        window.location.href = "memoria_sesiones.html";
    }
</script>
</body>
</html>
