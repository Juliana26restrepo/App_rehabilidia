<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 9: Control de Impulsos - REHABILIDIA</title>
    <style>
        :root { 
            --navy: #103A57; --gold: #FFD700; --bg: #F0F4F8; 
            --red: #D32F2F; --blue: #1976D2; --green: #388E3C; --yellow: #FBC02D;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px;
            background: white; position: relative; display: flex; flex-direction: column;
        }

        header { 
            background: var(--navy); color: white; height: 45px; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px; font-weight: bold; flex-shrink: 0;
        }

        .btn-salir {
            background: #D32F2F; color: white; border: none; padding: 5px 12px;
            border-radius: 5px; cursor: pointer; font-size: 0.8rem;
        }

        .stats-bar { 
            display: flex; justify-content: center; gap: 20px; 
            font-weight: bold; padding: 10px; border-bottom: 2px solid var(--navy); 
        }

        #zona-juego { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 20px;
        }

        #palabra-estimulo {
            font-size: 5rem; font-weight: 900; margin-bottom: 40px;
            text-transform: uppercase; letter-spacing: 5px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .opciones-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            width: 100%; max-width: 500px;
        }

        .btn-color {
            height: 80px; border: none; border-radius: 15px;
            cursor: pointer; transition: transform 0.1s;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        .btn-color:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        .rojo { background-color: var(--red); }
        .azul { background-color: var(--blue); }
        .verde { background-color: var(--green); }
        .amarillo { background-color: var(--yellow); }

        .overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(16, 58, 87, 0.95); color: white; 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 100; text-align: center; padding: 30px; 
        }

        .btn-ready { 
            background: var(--gold); border: none; padding: 15px 40px; 
            border-radius: 30px; font-weight: bold; cursor: pointer; 
            font-size: 1.2rem; color: var(--navy); margin-top: 20px; 
        }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header>
        <span>SESIÓN 9: CONTROL DE IMPULSOS</span>
        <button class="btn-salir" onclick="irAlMenu()">SALIR Y GUARDAR</button>
    </header>

    <div class="stats-bar">
        <span id="txt-nivel">Nivel: 1</span>
        <span id="txt-ronda">Ronda: 1 / 2</span>
        <span id="txt-errores" style="color: var(--red);">Errores: 0</span>
    </div>

    <div id="zona-juego">
        <div id="palabra-estimulo">---</div>
        
        <div class="opciones-grid">
            <button class="btn-color rojo" onclick="verificarRespuesta('ROJO')"></button>
            <button class="btn-color azul" onclick="verificarRespuesta('AZUL')"></button>
            <button class="btn-color verde" onclick="verificarRespuesta('VERDE')"></button>
            <button class="btn-color amarillo" onclick="verificarRespuesta('AMARILLO')"></button>
        </div>
    </div>

    <div id="overlay-msg" class="overlay" style="display: flex;">
        <h1 id="msg-titulo" style="color: var(--gold);">NIVEL 1</h1>
        <p id="msg-cuerpo" style="font-size: 1.3rem;">Juan, presiona el botón del <strong>COLOR DE LA TINTA</strong>, ignorando lo que diga la palabra.</p>
        <button class="btn-ready" onclick="cerrarOverlay()">COMENZAR</button>
    </div>

    <div id="overlay-final" class="overlay">
        <div style="background: white; color: var(--navy); padding: 30px; border-radius: 20px; border: 5px solid var(--gold); width: 90%; max-width: 400px;">
            <h2>¡SESIÓN COMPLETADA!</h2>
            <p id="stats-resumen" style="font-size: 1.2rem; margin: 20px 0;"></p>
            <button class="btn-ready" onclick="irAlMenu()">GUARDAR Y VOLVER</button>
        </div>
    </div>
</div>

<script>
    const colores = [
        { nombre: "ROJO", hex: "#D32F2F" },
        { nombre: "AZUL", hex: "#1976D2" },
        { nombre: "VERDE", hex: "#388E3C" },
        { nombre: "AMARILLO", hex: "#FBC02D" }
    ];

    let nivel = 1, ronda = 1, aciertos = 0, errores = 0;
    const RONDAS_POR_NIVEL = 2; // MODIFICADO A 2 RONDAS
    let colorCorrecto = "";

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
    }

    function iniciarSesion() {
        hablar("Juan, presiona el botón del color de la tinta.");
    }

    function cerrarOverlay() {
        document.getElementById('overlay-msg').style.display = 'none';
        nuevaRonda();
    }

    function nuevaRonda() {
        if (ronda > RONDAS_POR_NIVEL) {
            if (nivel < 3) {
                nivel++; ronda = 1;
                document.getElementById('msg-titulo').innerText = `NIVEL ${nivel}`;
                document.getElementById('msg-cuerpo').innerText = "¡Bien hecho! Continuamos con el siguiente nivel.";
                document.getElementById('overlay-msg').style.display = 'flex';
                actualizarUI();
                return;
            } else {
                finalizar();
                return;
            }
        }

        let indicePalabra = Math.floor(Math.random() * colores.length);
        let indiceColor = Math.floor(Math.random() * colores.length);
        
        // Reto Stroop: forzar que el color de la tinta NO coincida con la palabra
        while(indiceColor === indicePalabra) {
            indiceColor = Math.floor(Math.random() * colores.length);
        }

        const el = document.getElementById('palabra-estimulo');
        el.innerText = colores[indicePalabra].nombre;
        el.style.color = colores[indiceColor].hex;
        colorCorrecto = colores[indiceColor].nombre;

        actualizarUI();
    }

    function verificarRespuesta(colorPresionado) {
        if (colorPresionado === colorCorrecto) {
            aciertos++;
        } else {
            errores++;
            // Feedback visual simple
            document.getElementById('palabra-estimulo').style.opacity = "0.5";
            setTimeout(() => { document.getElementById('palabra-estimulo').style.opacity = "1"; }, 150);
        }
        ronda++;
        nuevaRonda();
    }

    function actualizarUI() {
        document.getElementById('txt-nivel').innerText = `Nivel: ${nivel}`;
        document.getElementById('txt-ronda').innerText = `Ronda: ${ronda} / ${RONDAS_POR_NIVEL}`;
        document.getElementById('txt-errores').innerText = `Errores: ${errores}`;
    }

    function finalizar() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / total) * 100) || 0;
        document.getElementById('stats-resumen').innerHTML = `
            <strong>Aciertos:</strong> ${aciertos}<br>
            <strong>Errores:</strong> ${errores}<br>
            <strong>Eficacia:</strong> ${ef}%
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("Sesión terminada. Muy buen trabajo guardando tus impulsos.");
    }

    function irAlMenu() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / (total === 0 ? 1 : total)) * 100) || 0;
        
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas",
            id_sesion: 9,
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datosSesion);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));

        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
