<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 9: Monitoreo y Control - REHABILIDIA</title>
    <style>
        :root { --navy: #103A57; --gold: #FFD700; --bg: #F0F4F8; --red: #D32F2F; --green: #388E3C; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); overflow: hidden; }

        #viewport-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: white; }
        
        header { background: var(--navy); color: white; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-weight: bold; }
        .btn-salir { background: var(--red); color: white; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .stats-top { display: flex; justify-content: space-around; padding: 12px; background: white; border-bottom: 2px solid #ddd; font-weight: bold; font-size: 1.1rem; }

        .main-content { flex: 1; display: grid; grid-template-columns: 1fr 100px; position: relative; }
        
        #zona-juego { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        
        #palabra-display { font-size: 5.5rem; font-weight: 900; margin-bottom: 40px; cursor: pointer; user-select: none; }

        /* Barra Lateral de Estado (Capturas 8 y 10) */
        .sidebar { display: flex; flex-direction: column; align-items: center; padding: 20px 0; background: #f4f4f4; border-left: 1px solid #ddd; }
        .bar-container { width: 30px; height: 75%; background: #e0e0e0; border-radius: 20px; position: relative; border: 1px solid #ccc; overflow: hidden; }
        #bar-fill { width: 100%; height: 0%; position: absolute; bottom: 0; background: var(--green); transition: height 0.3s, background 0.3s; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        .emocion-slider { width: 100%; max-width: 500px; margin: 40px 0; accent-color: var(--navy); }
        .btn-ready { background: var(--navy); color: white; border: none; padding: 15px 50px; border-radius: 30px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body onload="abrirMonitoreo('pre')">

<div id="viewport-container">
    <header>
        <span>SESIÓN 9: CONTROL EJECUTIVO</span>
        <button class="btn-salir" onclick="window.location.href='funcion_sesiones.html'">SALIR</button>
    </header>

    <div class="stats-top">
        <span>NIVEL: <span id="txt-nivel">1</span></span>
        <span>PUNTOS: <span id="txt-puntos">0</span>/10</span>
        <span>RONDA: <span id="txt-ronda">1</span>/2</span>
    </div>

    <div class="main-content">
        <div id="zona-juego">
            <h3 id="instruccion-guia" style="color: var(--navy); margin-bottom: 20px;"></h3>
            <div id="palabra-display" onclick="validarAccion()">---</div>
            <p>Toca la palabra si cumple la instrucción</p>
        </div>

        <div class="sidebar">
            <span style="font-weight: bold; font-size: 0.75rem;">ESTADO</span>
            <div class="bar-container"><div id="bar-fill"></div></div>
            <span style="font-size: 0.7rem; margin-top: 5px;">CALMA</span>
        </div>
    </div>

    <div id="overlay-emocion" class="overlay">
        <h1 id="emo-titulo">Juan, monitorea tu estado actual</h1>
        <input type="range" id="slider-emocion" class="emocion-slider" min="0" max="100" value="10">
        <button class="btn-ready" onclick="procesarMonitoreo()">CONTINUAR</button>
    </div>

    <div id="overlay-pausa" class="overlay" style="background: var(--navy); color: white;">
        <h1>CONTROL DE IMPULSIVIDAD</h1>
        <p style="font-size: 1.5rem;">Juan, vamos a respirar...</p>
        <div id="timer-pausa" style="font-size: 5rem; font-weight: bold;">10</div>
    </div>
</div>

<script>
    // Lógica de Niveles y Palabras
    const palabrasPos = ["FELIZ", "LOGRO", "ÉXITO", "SÍ", "BIEN"];
    const palabrasNeg = ["MALO", "FALLO", "NO", "ERROR", "TRISTE"];
    const colores = { verde: "#388E3C", rojo: "#D32F2F", azul: "#103A57" };

    let nivel = 1, ronda = 1, puntos = 0, impulsividad = 0;
    let aciertos = 0, errores = 0, preEmo, postEmo, modo = 'pre';
    let esTarget = false, timerJuego;

    function abrirMonitoreo(m) {
        modo = m;
        document.getElementById('overlay-emocion').style.display = 'flex';
        if(m === 'post') document.getElementById('emo-titulo').innerText = "Juan, ¿cómo te sientes al finalizar?";
    }

    function procesarMonitoreo() {
        if(modo === 'pre') {
            preEmo = document.getElementById('slider-emocion').value;
            document.getElementById('overlay-emocion').style.display = 'none';
            iniciarJuego();
        } else {
            postEmo = document.getElementById('slider-emocion').value;
            guardarYSalir();
        }
    }

    function iniciarJuego() {
        puntos = 0;
        document.getElementById('txt-puntos').innerText = puntos;
        document.getElementById('txt-nivel').innerText = nivel;
        document.getElementById('txt-ronda').innerText = ronda;
        
        let texto = nivel === 1 ? "POSITIVA y VERDE" : nivel === 2 ? "NEGATIVA y ROJO" : "POSITIVA y AZUL";
        document.getElementById('instruccion-guia').innerText = "Busca: " + texto;
        lanzarPalabra();
    }

    function lanzarPalabra() {
        clearTimeout(timerJuego);
        const display = document.getElementById('palabra-display');
        const tipo = Math.random() > 0.5 ? 'pos' : 'neg';
        const colKeys = Object.keys(colores);
        const col = colKeys[Math.floor(Math.random() * colKeys.length)];

        display.innerText = tipo === 'pos' ? palabrasPos[Math.floor(Math.random()*5)] : palabrasNeg[Math.floor(Math.random()*5)];
        display.style.color = colores[col];

        // Lógica de validación exacta
        if(nivel === 1) esTarget = (tipo === 'pos' && col === 'verde');
        else if(nivel === 2) esTarget = (tipo === 'neg' && col === 'rojo');
        else esTarget = (tipo === 'pos' && col === 'azul');

        timerJuego = setTimeout(lanzarPalabra, 2500 - (nivel * 300));
    }

    function validarAccion() {
        if(esTarget) {
            puntos++; aciertos++;
            impulsividad = Math.max(0, impulsividad - 10);
        } else {
            errores++; impulsividad += 25;
            if(puntos > 0) puntos--; // Resta punto por error
        }

        actualizarUI();

        if(impulsividad >= 100) activaPausa();
        else if(puntos >= 10) avanzar();
        else lanzarPalabra();
    }

    function actualizarUI() {
        document.getElementById('txt-puntos').innerText = puntos;
        const fill = document.getElementById('bar-fill');
        fill.style.height = impulsividad + "%";
        // Cambio de color de la barra (Verde -> Amarillo -> Rojo)
        fill.style.background = impulsividad < 40 ? "#388E3C" : impulsividad < 75 ? "#FFD700" : "#D32F2F";
    }

    function activaPausa() {
        clearTimeout(timerJuego);
        impulsividad = 0; actualizarUI();
        document.getElementById('overlay-pausa').style.display = 'flex';
        let seg = 10;
        let c = setInterval(() => {
            seg--; document.getElementById('timer-pausa').innerText = seg;
            if(seg <= 0) { 
                clearInterval(c); 
                document.getElementById('overlay-pausa').style.display = 'none'; 
                lanzarPalabra(); 
            }
        }, 1000);
    }

    function avanzar() {
        if(ronda < 2) { ronda++; iniciarJuego(); }
        else if(nivel < 3) { nivel++; ronda = 1; iniciarJuego(); }
        else { abrirMonitoreo('post'); }
    }

    function guardarYSalir() {
        // Lógica de guardado en LocalStorage id_sesion: 9
        const efi = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        const res = { fecha: new Date().toLocaleDateString(), modulo: "Funciones Ejecutivas", id_sesion: 9, aciertos, errores, eficacia: efi + "%", emo_ini: preEmo, emo_fin: postEmo };
        let h = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        h.push(res);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(h));
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
