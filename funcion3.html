<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sesión 3: Control Inhibitorio - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --bg: #CEE5D6; --gold: #FFD700; 
            --navy: #103A57; --white: #ffffff;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1a; 
            display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px; background: var(--bg);
            position: relative; display: flex; flex-direction: column;
        }

        header { background: var(--navy); color: white; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        #contenedor-juego { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 20px; }
        
        .panel-regla { 
            background: var(--p-purple); color: white; padding: 15px 40px; border-radius: 50px; 
            font-size: 1.5rem; font-weight: bold; border: 4px solid var(--gold);
        }

        #estimulo-central { font-size: 5rem; font-weight: 900; text-align: center; }

        /* Cuadrícula de 4 botones SIEMPRE fija */
        #zona-opciones { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: 1fr 1fr;
            gap: 20px; 
            width: 100%; 
            max-width: 600px;
            height: 250px;
        }

        .opcion { 
            background: var(--white); border: 5px solid var(--navy); border-radius: 20px; 
            font-size: 1.8rem; font-weight: bold; cursor: pointer; color: var(--navy);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 0px var(--navy); text-transform: uppercase;
        }
        .opcion:active { transform: translateY(4px); box-shadow: 0 2px 0px var(--navy); }

        /* Pantallas de mensaje */
        #pantalla-mensaje, #overlay-final { 
            position: absolute; inset: 0; background: var(--p-purple); color: white;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 30px;
        }
        .btn-grande { background: var(--gold); color: var(--p-purple); border: none; padding: 20px 50px; border-radius: 50px; font-size: 1.5rem; font-weight: bold; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 3</header>

    <div id="contenedor-juego">
        <div id="info-progreso" style="font-weight: bold; color: var(--navy); font-size: 1.2rem;"></div>
        <div id="panel-regla" class="panel-regla">LEE LA PALABRA</div>
        
        <div id="estimulo-central">---</div>

        <div id="zona-opciones">
            <div class="opcion" id="opt0" onclick="procesarRespuesta(0)"></div>
            <div class="opcion" id="opt1" onclick="procesarRespuesta(1)"></div>
            <div class="opcion" id="opt2" onclick="procesarRespuesta(2)"></div>
            <div class="opcion" id="opt3" onclick="procesarRespuesta(3)"></div>
        </div>
    </div>

    <div id="pantalla-mensaje">
        <h1 id="msg-titulo" style="color: var(--gold);"></h1>
        <p id="msg-texto" style="font-size: 1.4rem; max-width: 80%"></p>
        <button class="btn-grande" onclick="cerrarMensaje()">EMPEZAR</button>
    </div>

    <div id="overlay-final">
        <h1>¡SESIÓN FINALIZADA!</h1>
        <div id="stats" style="font-size: 1.5rem; margin: 20px 0;"></div>
        <button class="btn-grande" onclick="guardarYSalir()">GUARDAR Y VOLVER</button>
    </div>
</div>

<script>
    const COLORES = [
        { nombre: "ROJO", hex: "#D32F2F" },
        { nombre: "AZUL", hex: "#1976D2" },
        { nombre: "VERDE", hex: "#388E3C" },
        { nombre: "AMARILLO", hex: "#FBC02D" },
        { nombre: "NEGRO", hex: "#212121" }
    ];

    let nivel = 1, ejercicio = 1, ronda = 1;
    let aciertos = 0, errores = 0, respuestaCorrecta = "";
    let reglaActual = "palabra";

    function hablar(texto) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(texto);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
    }

    function iniciar() {
        prepararNivel();
    }

    function prepararNivel() {
        const p = document.getElementById('pantalla-mensaje');
        const t = document.getElementById('msg-titulo');
        const txt = document.getElementById('msg-texto');
        
        if(nivel === 1) {
            t.innerText = "NIVEL 1: LECTURA";
            txt.innerText = "Juan, debes tocar el botón de la PALABRA que leas, sin importar el color de la letra.";
            reglaActual = "palabra";
        } else if(nivel === 2) {
            t.innerText = "NIVEL 2: COLORES";
            txt.innerText = "¡Cambio! Ahora toca el botón del COLOR de la letra, no leas la palabra.";
            reglaActual = "color";
        } else {
            t.innerText = "NIVEL 3: MIXTO";
            txt.innerText = "¡Mucha atención! Lee el recuadro de arriba para saber si debes tocar la palabra o el color.";
        }
        
        p.style.display = 'flex';
        hablar(txt.innerText);
    }

    function cerrarMensaje() {
        document.getElementById('pantalla-mensaje').style.display = 'none';
        siguienteTurno();
    }

    function siguienteTurno() {
        if (ronda > 4) {
            if (ejercicio < 3) {
                ejercicio++; ronda = 1;
                hablar("Siguiente ejercicio");
                siguienteTurno();
            } else {
                if (nivel < 3) { nivel++; ejercicio = 1; ronda = 1; prepararNivel(); }
                else { finalizar(); }
            }
            return;
        }

        document.getElementById('info-progreso').innerText = `Nivel ${nivel} - Ejercicio ${ejercicio}/3 - Turno ${ronda}/4`;

        // Definir regla en nivel mixto
        if (nivel === 3) {
            reglaActual = Math.random() > 0.5 ? "palabra" : "color";
        }
        document.getElementById('panel-regla').innerText = reglaActual === "palabra" ? "LEE LA PALABRA" : "MIRA EL COLOR";

        // Crear estímulo con trampa (Color de tinta != Palabra)
        let indicePalabra = Math.floor(Math.random() * COLORES.length);
        let indiceTinta;
        do { indiceTinta = Math.floor(Math.random() * COLORES.length); } while (indiceTinta === indicePalabra);

        const central = document.getElementById('estimulo-central');
        central.innerText = COLORES[indicePalabra].nombre;
        central.style.color = COLORES[indiceTinta].hex;

        // Definir cuál es la respuesta que debe buscar el usuario
        const objetoCorrecto = reglaActual === "palabra" ? COLORES[indicePalabra] : COLORES[indiceTinta];
        respuestaCorrecta = objetoCorrecto.nombre;

        // --- ASIGNACIÓN DE LOS 4 BOTONES ---
        // 1. Elegir un botón al azar para la respuesta correcta
        let botones = [0, 1, 2, 3];
        let idCorrecto = botones.splice(Math.floor(Math.random() * botones.length), 1)[0];
        document.getElementById(`opt${idCorrecto}`).innerText = respuestaCorrecta;

        // 2. Rellenar los otros 3 botones con colores diferentes a la correcta
        let distractores = COLORES.filter(c => c.nombre !== respuestaCorrecta);
        distractores.sort(() => Math.random() - 0.5);

        botones.forEach((idBoton, i) => {
            document.getElementById(`opt${idBoton}`).innerText = distractores[i].nombre;
        });
    }

    function procesarRespuesta(id) {
        const textoSeleccionado = document.getElementById(`opt${id}`).innerText;
        const container = document.getElementById('viewport-container');

        if (textoSeleccionado === respuestaCorrecta) {
            aciertos++;
            container.style.backgroundColor = "#C8E6C9";
        } else {
            errores++;
            container.style.backgroundColor = "#FFCDD2";
            hablar("Fíjate bien");
        }

        setTimeout(() => {
            container.style.backgroundColor = "var(--bg)";
            ronda++;
            siguienteTurno();
        }, 600);
    }

    function finalizar() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / total) * 100) || 0;
        document.getElementById('stats').innerHTML = `Aciertos: ${aciertos}<br>Errores: ${errores}<br>Eficacia: ${ef}%`;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar(`Sesión completada. Eficacia del ${ef} por ciento.`);
    }

    function guardarYSalir() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas",
            sesion: "Control Inhibitorio",
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };
        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        window.location.href = "funcion_sesiones.html";
    }

    window.onload = iniciar;
</script>
</body>
</html>
