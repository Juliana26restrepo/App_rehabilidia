<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sesión 3: Control Inhibitorio - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --bg: #CEE5D6; --gold: #FFD700; 
            --navy: #103A57; --white: #ffffff;
        }

        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1a; 
            display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px; background: var(--bg);
            position: relative; display: flex; flex-direction: column;
        }

        header { background: var(--navy); color: white; min-height: 50px; height: 7%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; text-align: center; padding: 0 10px; }

        /* Área de juego con scroll si es necesario */
        #contenedor-juego { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 10px; 
            overflow-y: auto; 
            gap: 15px;
        }
        
        .panel-regla { 
            background: var(--p-purple); color: white; padding: 10px 30px; border-radius: 50px; 
            font-size: 1.2rem; font-weight: bold; border: 3px solid var(--gold);
            margin-top: 5px;
        }

        #estimulo-central { 
            font-size: clamp(3rem, 12vh, 5rem); 
            font-weight: 900; 
            text-align: center; 
            margin: 10px 0;
            line-height: 1;
        }

        #zona-opciones { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            width: 100%; 
            max-width: 500px;
            padding-bottom: 20px; /* Espacio para no chocar con el borde inferior */
        }

        .opcion { 
            background: var(--white); border: 4px solid var(--navy); border-radius: 15px; 
            font-size: clamp(1.1rem, 4vh, 1.6rem); font-weight: bold; cursor: pointer; color: var(--navy);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 0px var(--navy); text-transform: uppercase;
            min-height: 70px; height: 12vh;
        }
        .opcion:active { transform: translateY(3px); box-shadow: 0 2px 0px var(--navy); }

        #pantalla-mensaje, #overlay-final { 
            position: absolute; inset: 0; background: var(--p-purple); color: white;
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px;
        }
        .btn-grande { background: var(--gold); color: var(--p-purple); border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.3rem; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        #info-progreso { font-weight: bold; color: var(--navy); font-size: 1rem; }
    </style>
</head>
<body>

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 3</header>

    <div id="contenedor-juego">
        <div id="info-progreso">Cargando...</div>
        <div id="panel-regla" class="panel-regla">---</div>
        
        <div id="estimulo-central">---</div>

        <div id="zona-opciones">
            <div class="opcion" id="opt0" onclick="procesarRespuesta(0)"></div>
            <div class="opcion" id="opt1" onclick="procesarRespuesta(1)"></div>
            <div class="opcion" id="opt2" onclick="procesarRespuesta(2)"></div>
            <div class="opcion" id="opt3" onclick="procesarRespuesta(3)"></div>
        </div>
    </div>

    <div id="pantalla-mensaje">
        <h1 id="msg-titulo" style="color: var(--gold); margin-bottom: 10px;"></h1>
        <p id="msg-texto" style="font-size: 1.2rem; max-width: 90%; line-height: 1.4;"></p>
        <button class="btn-grande" onclick="cerrarMensaje()">¡ENTENDIDO!</button>
    </div>

    <div id="overlay-final">
        <h1>¡SESIÓN FINALIZADA!</h1>
        <div id="stats" style="font-size: 1.4rem; margin: 15px 0; line-height: 1.6;"></div>
        <button class="btn-grande" onclick="guardarYSalir()">GUARDAR Y VOLVER</button>
    </div>
</div>

<script>
    const COLORES = [
        { nombre: "ROJO", hex: "#D32F2F" },
        { nombre: "AZUL", hex: "#1976D2" },
        { nombre: "VERDE", hex: "#388E3C" },
        { nombre: "AMARILLO", hex: "#FBC02D" },
        { nombre: "NEGRO", hex: "#212121" }
    ];

    let nivel = 1, ejercicio = 1, ronda = 1;
    let aciertos = 0, errores = 0, respuestaCorrecta = "";
    let reglaActual = "palabra";
    let bloqueado = false;

    function hablar(texto) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(texto);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
    }

    function iniciar() { prepararNivel(); }

    function prepararNivel() {
        const p = document.getElementById('pantalla-mensaje');
        const t = document.getElementById('msg-titulo');
        const txt = document.getElementById('msg-texto');
        
        if(nivel === 1) {
            t.innerText = "NIVEL 1: LECTURA";
            txt.innerText = "Juan, toca el botón de la PALABRA que leas. Ignora el color.";
            reglaActual = "palabra";
        } else if(nivel === 2) {
            t.innerText = "NIVEL 2: COLORES";
            txt.innerText = "¡Cambio! Ahora toca el botón del COLOR de la letra. No leas la palabra.";
            reglaActual = "color";
        } else {
            t.innerText = "NIVEL 3: MIXTO";
            txt.innerText = "¡Atención! Mira arriba: si dice LEE toca la palabra, si dice COLOR toca el color.";
        }
        
        p.style.display = 'flex';
        hablar(txt.innerText);
    }

    function cerrarMensaje() {
        document.getElementById('pantalla-mensaje').style.display = 'none';
        siguienteTurno();
    }

    function siguienteTurno() {
        if (ronda > 4) {
            if (ejercicio < 3) {
                ejercicio++; ronda = 1;
                hablar("Siguiente ejercicio");
                siguienteTurno();
            } else {
                if (nivel < 3) { nivel++; ejercicio = 1; ronda = 1; prepararNivel(); }
                else { finalizar(); }
            }
            return;
        }

        bloqueado = false;
        document.getElementById('info-progreso').innerText = `Nivel ${nivel} - Ejercicio ${ejercicio}/3 - Turno ${ronda}/4`;

        if (nivel === 3) { reglaActual = Math.random() > 0.5 ? "palabra" : "color"; }
        document.getElementById('panel-regla').innerText = reglaActual === "palabra" ? "LEE LA PALABRA" : "MIRA EL COLOR";

        let iP = Math.floor(Math.random() * COLORES.length);
        let iT;
        do { iT = Math.floor(Math.random() * COLORES.length); } while (iT === iP);

        const central = document.getElementById('estimulo-central');
        central.innerText = COLORES[iP].nombre;
        central.style.color = COLORES[iT].hex;

        const objetoCorrecto = reglaActual === "palabra" ? COLORES[iP] : COLORES[iT];
        respuestaCorrecta = objetoCorrecto.nombre;

        let botones = [0, 1, 2, 3];
        let idCorrecto = botones.splice(Math.floor(Math.random() * botones.length), 1)[0];
        document.getElementById(`opt${idCorrecto}`).innerText = respuestaCorrecta;

        let distractores = COLORES.filter(c => c.nombre !== respuestaCorrecta);
        distractores.sort(() => Math.random() - 0.5);

        botones.forEach((idBoton, i) => {
            document.getElementById(`opt${idBoton}`).innerText = distractores[i].nombre;
        });
        
        // Reset scroll al inicio de cada turno
        document.getElementById('contenedor-juego').scrollTop = 0;
    }

    function procesarRespuesta(id) {
        if(bloqueado) return;
        bloqueado = true;
        
        const textoSeleccionado = document.getElementById(`opt${id}`).innerText;
        const container = document.getElementById('viewport-container');

        if (textoSeleccionado === respuestaCorrecta) {
            aciertos++;
            container.style.backgroundColor = "#C8E6C9";
        } else {
            errores++;
            container.style.backgroundColor = "#FFCDD2";
            hablar("Concéntrate Juan");
        }

        setTimeout(() => {
            container.style.backgroundColor = "var(--bg)";
            ronda++;
            siguienteTurno();
        }, 700);
    }

    function finalizar() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / total) * 100) || 0;
        document.getElementById('stats').innerHTML = `Aciertos: <b>${aciertos}</b><br>Errores: <b>${errores}</b><br>Eficacia: <b>${ef}%</b>`;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar(`Sesión completada. Lograste un ${ef} por ciento de eficacia.`);
    }

    function guardarYSalir() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / total) * 100) || 0;
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas",
            sesion: "Control Inhibitorio",
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };
        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        historial.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial));
        window.location.href = "funcion_sesiones.html";
    }

    window.onload = iniciar;
</script>
</body>
</html>
