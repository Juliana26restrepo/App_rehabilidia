<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 3: Control Inhibitorio - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --s-purple: #AB47BC; --bg: #CEE5D6; --gold: #FFD700; 
            --navy: #103A57; --white: #ffffff; --error: #D32F2F;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; 
            display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px; background: var(--bg);
            position: relative; display: flex; flex-direction: column;
        }

        header { background: var(--navy); color: white; height: 8%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }

        #contenedor-juego { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 10px; }
        
        .panel-regla { 
            background: var(--p-purple); color: white; padding: 12px 30px; border-radius: 50px; 
            font-size: 1.3rem; font-weight: bold; border: 4px solid var(--gold); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        #estimulo-central { font-size: clamp(3rem, 15vw, 5rem); font-weight: 900; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; }

        #zona-opciones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 95%; max-width: 500px; }

        .opcion { 
            background: var(--white); border: 3px solid var(--navy); padding: 20px 10px; border-radius: 15px; 
            font-size: 1.3rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0px var(--navy);
            transition: all 0.1s; display: flex; align-items: center; justify-content: center; color: var(--navy);
            text-transform: uppercase;
        }
        .opcion:active { transform: translateY(3px); box-shadow: 0 2px 0px var(--navy); }
        
        #pantalla-transicion, #overlay-final { 
            position: absolute; inset:0; display:none; flex-direction:column; 
            justify-content:center; align-items:center; z-index: 2000; padding: 20px; 
        }
        
        #pantalla-transicion { background: var(--p-purple); color: white; }
        #overlay-final { background: rgba(16, 58, 87, 0.98); color: white; }
        
        .cuadro-resultados { background: var(--white); color: var(--navy); padding: 30px; border-radius: 30px; width: 90%; max-width: 450px; border: 6px solid var(--gold); text-align: center; }
        .avatar-guia { width: 80px; height: 80px; background: white; border-radius: 50%; border: 4px solid var(--gold); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }

        .btn-inicio { background: var(--gold); color: var(--p-purple); border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 20px; display: none; }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 3</header>

    <div id="contenedor-juego">
        <div id="info-progreso" style="font-weight: bold; color: var(--navy); font-size: 0.9rem;">Cargando...</div>
        <div id="panel-regla" class="panel-regla">PREPÁRATE</div>
        <div id="estimulo-central">---</div>
        <div id="zona-opciones"></div>
    </div>

    <div id="pantalla-transicion">
        <div class="avatar-guia">👨‍⚕️</div>
        <h1 id="titulo-aviso" style="color: var(--gold); margin:0; font-size: 1.8rem;">NIVEL 1</h1>
        <p id="texto-aviso" style="font-size: 1.2rem; text-align: center; max-width: 600px; line-height: 1.4;"></p>
        <button id="btn-empezar" class="btn-inicio" onclick="cerrarTransicion()">¡ENTENDIDO!</button>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h1 style="color: var(--p-purple); margin: 0; font-size: 1.5rem;">¡SESIÓN COMPLETADA!</h1>
            <div id="visual-stats" style="margin: 20px 0; text-align: left; font-size: 1.1rem; color: var(--navy);"></div>
            <button class="opcion" style="width: 100%; background: #2E7D32; color: white; border: none; box-shadow: none;" onclick="guardarYSalir()">FINALIZAR Y GUARDAR</button>
        </div>
    </div>
</div>

<script>
    const colores = [
        { n: "ROJO", h: "#D32F2F" }, { n: "AZUL", h: "#1976D2" },
        { n: "VERDE", h: "#388E3C" }, { n: "AMARILLO", h: "#FBC02D" },
        { n: "NEGRO", h: "#212121" }
    ];

    let nivelActual = 1, ejercicioActual = 1, rondaActual = 1;
    let aciertos = 0, errores = 0, regla = "palabra";
    let esperandoRespuesta = false;

    function hablar(t, callback) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES'; m.rate = 0.9;
        m.onend = () => { if(callback) callback(); };
        window.speechSynthesis.speak(m);
    }

    function iniciarSesion() {
        mostrarTransicion();
    }

    function mostrarTransicion() {
        const tit = document.getElementById('titulo-aviso');
        const desc = document.getElementById('texto-aviso');
        const btn = document.getElementById('btn-empezar');
        btn.style.display = "none";
        
        let texto = "";
        if(nivelActual === 1) {
            tit.innerText = "NIVEL 1: LECTURA";
            texto = "Juan, vas a tocar el botón con el nombre de la palabra. Ignora el color de la tinta, solo lee lo que dice.";
            regla = "palabra";
        } else if(nivelActual === 2) {
            tit.innerText = "NIVEL 2: COLORES";
            texto = "¡Cambiamos la regla! Ahora toca el botón del color de la tinta. No leas la palabra, fíjate solo en el color.";
            regla = "color";
        } else {
            tit.innerText = "NIVEL 3: MIXTO";
            texto = "¡Atención máxima! La regla cambiará en cada ejercicio. Si arriba dice LEE toca la palabra, si dice COLOR toca el color de la tinta.";
        }

        desc.innerText = texto;
        document.getElementById('pantalla-transicion').style.display = 'flex';
        hablar(texto, () => { btn.style.display = "block"; });
    }

    function cerrarTransicion() {
        document.getElementById('pantalla-transicion').style.display = 'none';
        proximaPregunta();
    }

    function proximaPregunta() {
        if (rondaActual > 4) {
            if (ejercicioActual < 3) {
                ejercicioActual++; rondaActual = 1;
                hablar(`Bien Juan. Ejercicio ${ejercicioActual}.`, proximaPregunta);
            } else {
                if (nivelActual < 3) { nivelActual++; ejercicioActual = 1; rondaActual = 1; mostrarTransicion(); }
                else { finalizar(); }
            }
            return;
        }

        document.getElementById('info-progreso').innerText = `Nivel ${nivelActual} - Ejercicio ${ejercicioActual}/3 (Ronda ${rondaActual}/4)`;
        
        if (nivelActual === 3) { regla = Math.random() > 0.5 ? "palabra" : "color"; }
        document.getElementById('panel-regla').innerText = regla === "palabra" ? "LEE LA PALABRA" : "MIRA EL COLOR";

        // Seleccionar palabra y color de tinta (que sean diferentes para crear interferencia)
        const pRandom = colores[Math.floor(Math.random() * colores.length)];
        let cRandom;
        do { cRandom = colores[Math.floor(Math.random() * colores.length)]; } while (cRandom.h === pRandom.h);

        const display = document.getElementById('estimulo-central');
        display.innerText = pRandom.n;
        display.style.color = cRandom.h;

        const correcta = regla === "palabra" ? pRandom : cRandom;
        esperandoRespuesta = true;

        // LÓGICA CORREGIDA: Asegurar que la correcta esté siempre
        const contenedor = document.getElementById('zona-opciones');
        contenedor.innerHTML = "";
        
        // 1. Filtrar los demás colores para que no se repita la correcta
        let otrosColores = colores.filter(c => c.n !== correcta.n);
        // 2. Mezclar los otros y tomar 3
        otrosColores.sort(() => 0.5 - Math.random());
        let opcionesFinales = [correcta, otrosColores[0], otrosColores[1], otrosColores[2]];
        // 3. Mezclar las 4 opciones finales
        opcionesFinales.sort(() => 0.5 - Math.random());

        opcionesFinales.forEach(col => {
            const btn = document.createElement('div');
            btn.className = 'opcion';
            btn.innerText = col.n;
            btn.onpointerdown = (e) => {
                if(!esperandoRespuesta) return;
                esperandoRespuesta = false;
                const container = document.getElementById('viewport-container');
                
                if (col.n === correcta.n) {
                    aciertos++;
                    container.style.backgroundColor = "#C8E6C9";
                } else {
                    errores++;
                    container.style.backgroundColor = "#FFCDD2";
                    hablar("Concéntrate Juan.");
                }
                
                setTimeout(() => {
                    container.style.backgroundColor = "#CEE5D6";
                    rondaActual++;
                    proximaPregunta();
                }, 600);
            };
            contenedor.appendChild(btn);
        });
    }

    function finalizar() {
        const total = aciertos + errores;
        const eficacia = Math.round((aciertos / total) * 100) || 0;
        document.getElementById('visual-stats').innerHTML = `
            <p><b>Aciertos:</b> ${aciertos}</p>
            <p><b>Errores:</b> ${errores}</p>
            <hr>
            <h2 style="color:#2E7D32">Eficacia: ${eficacia}%</h2>
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar(`Sesión completada Juan. Eficacia del ${eficacia} por ciento.`);
    }

    function guardarYSalir() {
        const total = aciertos + errores;
        const ef = Math.round((aciertos / total) * 100) || 0;
        
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Función Ejecutiva", 
            id_sesion: 3,       
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || []; 
        if (!Array.isArray(historial)) historial = []; 
        historial.push(datosSesion); 
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial)); 

        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
