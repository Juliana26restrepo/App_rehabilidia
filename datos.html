<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - REHABILIDIA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --p-blue: #103A57; --t-blue: #307B8E; --silver: #CEE5D6; --m-green: #366B2B; --soft-red: #e74c3c; }
        body { font-family: sans-serif; margin: 0; background: var(--silver); color: var(--p-blue); }
        header { background: var(--p-blue); color: white; padding: 15px; text-align: center; font-weight: bold; display: flex; align-items: center; justify-content: center; position: relative; }
        .btn-retroceder { position: absolute; left: 15px; color: white; text-decoration: none; font-size: 1.5rem; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; background: #abc; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--t-blue); color: white; }
        .card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item { border-bottom: 1px solid #eee; padding: 12px 0; font-size: 0.9rem; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; color: white; margin-bottom: 5px; }
        .tag-atencion { background: #e11d48; }
        .tag-memoria { background: #2563eb; }
        .tag-ejecutiva { background: #16a34a; }
        
        /* Estilos para el Diario Clínico */
        .info-clinica-diario { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; background: #f0f4f8; padding: 8px; border-radius: 8px; font-size: 0.75rem; }
        .check-si { color: var(--m-green); font-weight: bold; }
        .check-no { color: var(--soft-red); font-weight: bold; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .chip-data { font-size: 0.65rem; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: #475569; }
        .chip-avd { background: #dcfce7; color: #166534; }

        .hidden { display: none; }
        .fecha-historial { float: right; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>

<header>
    <a href="perfil_paciente.html" class="btn-retroceder">❮</a>
    CENTRAL DE DATOS
</header>

<div class="container">
    <div class="tabs">
        <button id="bt1" class="tab-btn active" onclick="ver('d')">Diario</button>
        <button id="bt2" class="tab-btn" onclick="ver('s')">Sesiones</button>
    </div>

    <div id="sd">
        <div class="card"><h3>Historial de Energía y Ánimo</h3><canvas id="graf"></canvas></div>
        <div class="card"><h3>Historial Diario</h3><div id="listD"></div></div>
    </div>

    <div id="ss" class="hidden">
        <div class="card"><h3>Evolución de Sesiones</h3><canvas id="grafSesiones"></canvas></div>
        <div class="card"><h3>Progreso de Ejercicios</h3><div id="listS"></div></div>
    </div>
</div>

<script>
    function ver(t) {
        document.getElementById('sd').classList.toggle('hidden', t !== 'd');
        document.getElementById('ss').classList.toggle('hidden', t !== 's');
        document.getElementById('bt1').classList.toggle('active', t === 'd');
        document.getElementById('bt2').classList.toggle('active', t === 's');
    }

    window.onload = function() {
        try {
            const historialDiario = JSON.parse(localStorage.getItem('diario_juan')) || [];
            const sesiones = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];

            // 1. GRÁFICA DIARIO
            if(historialDiario.length > 0) {
                new Chart(document.getElementById('graf'), {
                    type: 'line',
                    data: {
                        labels: historialDiario.map(r => r.fecha),
                        datasets: [
                            { label: 'Energía', data: historialDiario.map(r => r.energia), borderColor: '#307B8E', tension: 0.3 },
                            { label: 'Ánimo', data: historialDiario.map(r => r.emocionValor || r.emocion), borderColor: '#103A57', borderDash: [5, 5], tension: 0.3 }
                        ]
                    }
                });
                
                const ld = document.getElementById('listD');
                [...historialDiario].reverse().forEach(r => {
                    const c = r.clinico || {};
                    const e = r.ejecutivo || {};
                    
                    // Lógica para el texto de estado (evitar undefined)
                    const valAnimo = r.emocionValor || 5;
                    let txtEstado = r.emocion || (valAnimo >= 8 ? "Excelente" : valAnimo >= 5 ? "Bien" : "Bajo");

                    ld.innerHTML += `
                        <div class="item">
                            <span class="fecha-historial">${r.fecha}</span>
                            <b>Estado: ${txtEstado} (${valAnimo}/10)</b><br>
                            <small>Energía Vital: ${r.energia}/10</small>
                            
                            <div class="info-clinica-diario">
                                <span>Ansiedad: <b>${c.ansiedad || '0'}</b></span>
                                <span>Irrita: <b>${c.irritabilidad || '0'}</b></span>
                                <span><i class="fas ${e.planificacion ? 'fa-check-circle check-si' : 'fa-times-circle check-no'}"></i> Planificó</span>
                                <span><i class="fas ${e.monitoreoErrores ? 'fa-check-circle check-si' : 'fa-times-circle check-no'}"></i> Monitoreó</span>
                            </div>

                            ${c.sintomas && c.sintomas.length > 0 ? `
                                <div class="chip-container">
                                    ${c.sintomas.map(s => `<span class="chip-data">${s}</span>`).join('')}
                                </div>
                            ` : ''}

                            ${e.avd_completas && e.avd_completas.length > 0 ? `
                                <div class="chip-container">
                                    ${e.avd_completas.map(a => `<span class="chip-data chip-avd">${a}</span>`).join('')}
                                </div>
                            ` : ''}

                            ${r.nota ? `<div style="font-size:0.8rem; color:#555; margin-top:5px; font-style:italic; border-left: 2px solid #ddd; padding-left:5px;">"${r.nota}"</div>` : ''}
                        </div>`;
                });
            }

            // 2. GRÁFICA DE EVOLUCIÓN (SESIONES) - ORIGINAL SIN CAMBIOS
            const ls = document.getElementById('listS');
            if(sesiones.length > 0) {
                const etiquetas = sesiones.map(s => {
                    if (s.modulo.includes("Memoria")) return `M${s.id_sesion}`;
                    if (s.modulo.includes("Ejecutiva")) return `FE${s.id_sesion}`;
                    return `A${s.id_sesion}`;
                });
                const colores = sesiones.map(s => {
                    if (s.modulo.includes("Memoria")) return "#2563eb";
                    if (s.modulo.includes("Ejecutiva")) return "#16a34a";
                    return "#e11d48";
                });
                new Chart(document.getElementById('grafSesiones'), {
                    type: 'bar',
                    data: {
                        labels: etiquetas,
                        datasets: [{
                            label: '% Eficacia',
                            data: sesiones.map(s => parseInt(s.eficacia)),
                            backgroundColor: colores,
                            borderColor: colores,
                            borderWidth: 1
                        }]
                    },
                    options: { 
                        scales: { 
                            y: { beginAtZero: true, max: 100 },
                            x: { ticks: { font: { size: 10, weight: 'bold' } } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
                ls.innerHTML = "";
                [...sesiones].reverse().forEach(s => {
                    let clase = s.modulo.includes("Memoria") ? "tag-memoria" : (s.modulo.includes("Ejecutiva") ? "tag-ejecutiva" : "tag-atencion");
                    ls.innerHTML += `
                        <div class="item">
                            <span class="fecha-historial">${s.fecha}</span>
                            <span class="tag ${clase}">${s.modulo}</span><br>
                            <b>Sesión ${s.id_sesion}</b> - <strong>${s.eficacia}</strong>
                            <br><small>Aciertos: ${s.aciertos} | Errores: ${s.errores}</small>
                        </div>`;
                });
            } else {
                ls.innerHTML = "No hay sesiones registradas.";
            }
        } catch (e) { console.error("Error cargando datos: ", e); }
    }
</script>
</body>
</html>
