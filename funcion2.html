<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control Inhibitorio - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --s-purple: #AB47BC; --bg: #CEE5D6; --gold: #FFD700; 
            --rojo: #D32F2F; --azul: #1976D2; --amarillo: #FBC02D; --verde: #388E3C; --error: #D32F2F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1a; 
            text-align: center; color: var(--p-purple); height: 100vh; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }
        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1200px; background: var(--bg); 
            position: relative; display: flex; flex-direction: column;
        }
        header { background: #103A57; height: 8%; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
        
        #juego-area { flex-grow: 1; display: flex; flex-direction: row; align-items: center; justify-content: space-around; padding: 20px; position: relative; }
        
        #panel-izquierdo { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 45%; }
        #panel-derecho { display: flex; flex-direction: column; align-items: center; width: 45%; }

        .instruccion-visual { position: absolute; top: 15px; background: white; padding: 10px; border-radius: 15px; width: 90%; border: 2px solid var(--p-purple); display: flex; justify-content: center; gap: 15px; font-weight: bold; font-size: 0.8rem; z-index: 10; }
        .regla-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        #info-progreso { position: absolute; top: 75px; font-size: 0.9rem; font-weight: bold; color: #103A57; }

        #estimulo {
            width: 160px; height: 160px; border-radius: 50%; border: 8px solid white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 4.5rem; color: white; font-weight: bold;
        }

        #btn-accion {
            width: 220px; height: 220px; border-radius: 50%; background: var(--p-purple);
            color: white; border: 10px solid #ba68c8; font-size: 1.8rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 0 #2a0b52; transition: 0.1s;
        }
        #btn-accion:active { transform: translateY(6px); box-shadow: 0 4px 0 #2a0b52; }

        .contador-flotante { background: var(--gold); color: black; padding: 6px 18px; border-radius: 20px; border: 2px solid black; font-weight: bold; margin-bottom: 15px; }

        #pantalla-transicion, #overlay-final { 
            position: absolute; inset: 0; display:none; flex-direction:column; 
            justify-content:center; align-items:center; z-index:2000; 
            padding: 20px; background: var(--p-purple); color: white; 
        }
        .cuadro-final { background: white; color: var(--p-purple); padding: 30px; border-radius: 25px; width: 90%; max-width: 500px; }
        .avatar-guia { width: 100px; height: 100px; background: white; border-radius: 50%; border: 4px solid var(--gold); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        
        #btn-empezar { margin-top: 20px; padding: 15px 40px; background: var(--gold); color: var(--p-purple); border: none; border-radius: 30px; font-weight: bold; font-size: 1.2rem; cursor: pointer; display: none; }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header><span style="font-weight:bold;">SESIÓN 2: CONTROL INHIBITORIO</span></header>
    
    <div id="juego-area">
        <div id="instrucciones-nivel" class="instruccion-visual"></div>
        <div id="info-progreso">Cargando...</div>

        <div id="panel-izquierdo">
            <div id="estimulo"></div>
        </div>
        
        <div id="panel-derecho">
            <div id="cont-visual" class="contador-flotante">Toques: 0</div>
            <button id="btn-accion" onpointerdown="registrarToque()">TOCAR</button>
        </div>
    </div>

    <div id="pantalla-transicion">
        <div class="avatar-guia">👨‍⚕️</div>
        <h1 id="tit-nivel" style="background:var(--gold); color:var(--p-purple); padding:10px 40px; border-radius:40px;"></h1>
        <div id="desc-nivel" style="background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; font-size: 1.1rem; line-height: 1.5; width: 90%; max-width: 600px;"></div>
        <button id="btn-empezar" onclick="cerrarTransicion()">¡ENTENDIDO!</button>
    </div>

    <div id="overlay-final">
        <div class="cuadro-final">
            <div style="font-size: 3.5rem;">🏆</div>
            <h1 style="margin: 10px 0;">¡SESIÓN COMPLETADA!</h1>
            <div id="stats-visual" style="font-size:1.2rem; margin:20px 0; text-align: left;"></div>
            <button onclick="irAlMenu()" style="width:100%; padding:18px; background:#2E7D32; color:white; border-radius:50px; border:none; font-weight:bold; font-size: 1.2rem; cursor:pointer;">GUARDAR Y FINALIZAR</button>
        </div>
    </div>
</div>

<script>
    let nivel = 1, ejercicio = 1, ronda = 1;
    let aciertos = 0, errores = 0;
    let toquesDados = 0, toquesNecesarios = 0, esperandoRespuesta = false;
    let timerEstimulo;

    const config = {
        1: { nombre: "BÁSICO", tiempo: 3800, colores: ['rojo', 'azul', 'amarillo'] },
        2: { nombre: "INTERMEDIO", tiempo: 3000, colores: ['rojo', 'azul', 'amarillo', 'verde'] },
        3: { nombre: "AVANZADO", tiempo: 2400, colores: ['rojo', 'azul', 'amarillo', 'verde'] }
    };

    function hablar(t, callback) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES'; m.rate = 0.85;
        m.onend = () => { if(callback) callback(); };
        window.speechSynthesis.speak(m);
    }

    function iniciarSesion() {
        mostrarTransicion();
    }

    function mostrarTransicion() {
        const c = config[nivel];
        const tit = document.getElementById('tit-nivel');
        const desc = document.getElementById('desc-nivel');
        const instUI = document.getElementById('instrucciones-nivel');
        const btn = document.getElementById('btn-empezar');
        
        btn.style.display = "none";
        tit.innerText = `NIVEL ${nivel}: ${c.nombre}`;
        
        let textoInstruccion = `Juan, vas a tocar el botón según corresponda el color del círculo. `;
        let htmlReglas = `<div class="regla-item"><span class="dot" style="background:var(--rojo)"></span> Rojo: 2</div>`;
        htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--azul)"></span> Azul: 1</div>`;
        htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--amarillo)"></span> Amarillo: 0</div>`;
        
        textoInstruccion += `Toca 2 veces si es rojo. Toca 1 vez si es azul. Y no toques nada si es amarillo. `;

        if(nivel >= 2) {
            htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--verde)"></span> Verde: 3</div>`;
            textoInstruccion += `Toca 3 veces si es verde. `;
        }
        if(nivel === 3) {
            htmlReglas += `<div class="regla-item" style="color:var(--error)">⚠️ Letra X: Invierte Regla</div>`;
            textoInstruccion += `¡Atención! Si el círculo tiene una X, las reglas se invierten para todos los colores: Rojo pasa a cero, Amarillo pasa a dos, Azul pasa a tres y Verde pasa a uno.`;
        }

        desc.innerText = textoInstruccion;
        instUI.innerHTML = htmlReglas;
        document.getElementById('pantalla-transicion').style.display = 'flex';
        
        hablar(textoInstruccion, () => {
            btn.style.display = "block";
        });
    }

    function cerrarTransicion() {
        document.getElementById('pantalla-transicion').style.display = 'none';
        lanzarRonda();
    }

    function lanzarRonda() {
        if(ronda > 4) {
            if(ejercicio < 3) {
                ejercicio++; ronda = 1;
                hablar(`Buen trabajo. Ejercicio ${ejercicio}.`, lanzarRonda);
            } else {
                if(nivel < 3) { nivel++; ejercicio = 1; ronda = 1; mostrarTransicion(); }
                else { finalizarSesion(); }
            }
            return;
        }

        document.getElementById('info-progreso').innerText = `Nivel ${nivel} - Ejercicio ${ejercicio}/3 (Ronda ${ronda}/4)`;
        toquesDados = 0;
        document.getElementById('cont-visual').innerText = "Toques: 0";
        
        const c = config[nivel];
        let colorElegido = c.colores[Math.floor(Math.random() * c.colores.length)];

        const tieneX = (nivel === 3 && Math.random() > 0.5);
        const circulo = document.getElementById('estimulo');
        circulo.style.background = `var(--${colorElegido})`;
        circulo.innerText = tieneX ? "X" : "";
        
        // Lógica de toques base
        if(colorElegido === 'rojo') toquesNecesarios = 2;
        else if(colorElegido === 'azul') toquesNecesarios = 1;
        else if(colorElegido === 'amarillo') toquesNecesarios = 0;
        else if(colorElegido === 'verde') toquesNecesarios = 3;

        // Lógica de Inversión Completa para Nivel 3
        if(tieneX) {
            if(colorElegido === 'rojo') toquesNecesarios = 0;
            else if(colorElegido === 'amarillo') toquesNecesarios = 2;
            else if(colorElegido === 'azul') toquesNecesarios = 3;
            else if(colorElegido === 'verde') toquesNecesarios = 1;
        }

        esperandoRespuesta = true;
        timerEstimulo = setTimeout(() => evaluarRonda(), c.tiempo);
    }

    function registrarToque() {
        if(!esperandoRespuesta) return;
        toquesDados++;
        document.getElementById('cont-visual').innerText = `Toques: ${toquesDados}`;
    }

    function evaluarRonda() {
        clearTimeout(timerEstimulo);
        esperandoRespuesta = false;
        
        const estimulo = document.getElementById('estimulo');
        if(toquesDados === toquesNecesarios) {
            aciertos++;
            estimulo.style.borderColor = "#4CAF50";
        } else {
            errores++;
            estimulo.style.borderColor = "var(--error)";
            hablar("Cuidado.");
        }

        setTimeout(() => {
            estimulo.style.background = "transparent";
            estimulo.style.borderColor = "white";
            estimulo.innerText = "";
            ronda++;
            lanzarRonda();
        }, 1200);
    }

    function finalizarSesion() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        document.getElementById('stats-visual').innerHTML = `
            <p><b>Aciertos:</b> ${aciertos}</p>
            <p><b>Errores:</b> ${errores}</p>
            <h2 style="color:#2E7D32">Eficacia Real: ${ef}%</h2>
        `;
        document.getElementById('overlay-final').style.display = "flex";
        hablar("¡Increíble Juan! Sesión terminada.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Control Inhibitorio", id_sesion: 2,
            aciertos: aciertos, errores: errores, eficacia: ef + "%"
        };
        let h = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        h.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(h));
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
