<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flexibilidad - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --bg: #CEE5D6; --gold: #FFD700; --dark: #103A57;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #1a1a1a; 
            height: 100dvh; 
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
        }

        #contenedor-principal {
            width: 100%; height: 100%;
            max-width: 900px; max-height: 100%;
            background: var(--bg);
            display: flex; flex-direction: column;
            position: relative;
        }

        header { 
            background: var(--dark); height: 45px; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-weight: bold; flex-shrink: 0;
        }
        
        #contenedor-juego { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: space-around; 
            padding: 10px; min-height: 0;
        }

        .panel-regla { 
            width: 95%; background: var(--p-purple); color: white; 
            padding: 10px; border-radius: 12px; 
            font-size: clamp(1.2rem, 4vh, 1.8rem); 
            text-align: center; font-weight: bold; border: 3px solid var(--gold); 
            flex-shrink: 0; margin-bottom: 10px;
        }
        
        #zona-objetos { 
            display: grid; gap: 8px; width: 95%; 
            flex: 1; align-content: center; justify-content: center;
            min-height: 0;
        }

        .grid-1 { grid-template-columns: repeat(4, 1fr); }
        .grid-2 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(5, 1fr); }

        .objeto { 
            background: white; border-radius: 10px; padding: 5px; 
            border: 3px solid transparent; 
            display: flex; align-items: center; justify-content: center; 
            aspect-ratio: 1; box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            max-height: 80px; cursor: pointer;
        }
        
        .objeto img { max-width: 85%; max-height: 85%; object-fit: contain; }
        .seleccionado { opacity: 0.2; pointer-events: none; transform: scale(0.9); transition: 0.3s; }

        .area-asistente { 
            height: 80px; background: white; padding: 5px 15px; 
            display: flex; align-items: center; gap: 10px; 
            border-top: 3px solid var(--p-purple); flex-shrink: 0;
        }
        .avatar-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--p-purple); }
        .burbuja { font-size: 0.9rem; color: var(--dark); flex: 1; font-weight: 500; }

        #overlay-transicion, #overlay-final { 
            position: absolute; inset: 0; 
            display:none; flex-direction:column; justify-content:center; 
            align-items:center; z-index:100; background: rgba(16, 58, 87, 0.95); color: white; 
        }

        .cuadro-resultados {
            background: white; color: var(--dark); padding: 30px;
            border-radius: 20px; width: 85%; max-width: 400px; border: 5px solid var(--gold);
            text-align: center;
        }

        .btn-final {
            margin-top: 20px; padding: 15px 30px; background: var(--p-purple); 
            color:white; border-radius: 50px; border:none; font-weight:bold; 
            font-size: 1.1rem; cursor:pointer; width: 100%;
        }
    </style>
</head>
<body>

<div id="contenedor-principal">
    <header>SESIÓN 2: FLEXIBILIDAD</header>

    <div id="contenedor-juego">
        <div id="panel-regla" class="panel-regla">ESPERA...</div>
        <div id="zona-objetos"></div>
    </div>

    <div class="area-asistente">
        <img src="https://raw.githubusercontent.com/Anmameche/Rehabilidia/main/coterapeuta.png" class="avatar-img">
        <div class="burbuja" id="texto-asistente">Juan, fíjate bien en la regla de arriba.</div>
    </div>

    <div id="overlay-transicion">
        <h1 style="color: var(--gold); font-size: 4rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5);">¡CAMBIO!</h1>
        <p style="font-size: 1.5rem;">Atento a la nueva regla...</p>
    </div>

    <div id="overlay-final">
        <div class="cuadro-resultados">
            <h1 style="color: var(--p-purple)">¡SESIÓN LISTA!</h1>
            <div id="metricas-finales" style="margin: 20px 0; font-size: 1.2rem; font-weight: bold;"></div>
            <button class="btn-final" onclick="guardarYSalir()">FINALIZAR Y SALIR</button>
        </div>
    </div>
</div>

<script>
    let aciertos = 0, errores = 0, nivel = 1, cambiosEnNivel = 0, aciertosReglaActual = 0, bloqueado = false;
    let rK = "", rV = "", ultimaReglaNom = "";

    const niveles = { 
        1: {est: 12, cambMax: 2, grid: 'grid-1'}, 
        2: {est: 16, cambMax: 2, grid: 'grid-2'}, 
        3: {est: 20, cambMax: 2, grid: 'grid-3'} 
    };

    const banco = [
        { f: "fresa.png", c: "rojo", t: "fruta" }, { f: "corazon.png", c: "rojo", t: "forma" }, { f: "cereza.png", c: "rojo", t: "fruta" }, { f: "alicate.png", c: "rojo", t: "herramienta" },
        { f: "avion.png", c: "gris", t: "transporte" }, { f: "tren.png", c: "azul", t: "transporte" }, { f: "camion.png", c: "blanco", t: "transporte" },
        { f: "perro.png", c: "cafe", t: "animal" }, { f: "gato.png", c: "gris", t: "animal" }, { f: "pajaro.png", c: "azul", t: "animal" },
        { f: "banano.png", c: "amarillo", t: "fruta" }, { f: "uva.png", c: "morado", t: "fruta" }, { f: "martillo.png", c: "cafe", t: "herramienta" },
        { f: "camiseta.png", c: "azul", t: "ropa" }, { f: "sarten.png", c: "negro", t: "cocina" }
    ];

    function hablar(t, callback) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t); m.lang = 'es-ES'; m.rate = 0.9;
        m.onend = () => { if(callback) callback(); };
        window.speechSynthesis.speak(m);
        document.getElementById('texto-asistente').innerText = t;
    }

    function generarTablero() {
        bloqueado = true;
        document.getElementById('overlay-transicion').style.display = 'none';
        const config = niveles[nivel];
        const zona = document.getElementById('zona-objetos');
        zona.className = config.grid;
        
        const reglas = [
            {n:"ROJOS", k:"c", v:"rojo"}, 
            {n:"ANIMALES", k:"t", v:"animal"}, 
            {n:"FRUTAS", k:"t", v:"fruta"}, 
            {n:"AZULES", k:"c", v:"azul"}
        ];
        
        let sel; 
        do { sel = reglas[Math.floor(Math.random() * reglas.length)]; } 
        while (sel.n === ultimaReglaNom);
        
        ultimaReglaNom = sel.n; rK = sel.k; rV = sel.v; aciertosReglaActual = 0;
        document.getElementById('panel-regla').innerText = "BUSCA: " + sel.n;
        
        hablar("Juan, busca los objetos " + sel.n, () => bloqueado = false);

        // Selección lógica para asegurar que existan objetivos
        let objetivos = banco.filter(b => b[rK] === rV).sort(()=>0.5-Math.random()).slice(0, 4);
        let dist = banco.filter(b => b[rK] !== rV).sort(()=>0.5-Math.random()).slice(0, config.est - objetivos.length);
        let mezcla = objetivos.concat(dist).sort(()=>0.5-Math.random());

        zona.innerHTML = "";
        mezcla.forEach(item => {
            const div = document.createElement('div');
            div.className = 'objeto';
            div.innerHTML = `<img src="./fun2/${item.f}" onerror="this.src='https://via.placeholder.com/60?text=OBJ'">`;
            div.onpointerdown = () => {
                if(bloqueado) return;
                if(item[rK] === rV) {
                    aciertos++; 
                    aciertosReglaActual++; 
                    div.classList.add('seleccionado');
                    
                    // Lógica de cambio de regla
                    if(aciertosReglaActual >= 2 && cambiosEnNivel < config.cambMax) {
                        bloqueado = true; 
                        cambiosEnNivel++;
                        setTimeout(() => {
                            document.getElementById('overlay-transicion').style.display = 'flex';
                            hablar("¡Cambio! Mucha atención.", () => {
                                setTimeout(generarTablero, 1200);
                            });
                        }, 500);
                    } else if (verificarSiNoHayMas()) {
                        // Avanzar nivel o finalizar
                        if(nivel < 3) { 
                            nivel++; 
                            cambiosEnNivel = 0; 
                            hablar("¡Excelente! Vamos al siguiente nivel.", () => generarTablero()); 
                        } else { 
                            finalizar(); 
                        }
                    }
                } else { 
                    errores++; 
                    div.style.borderColor = "red"; 
                    setTimeout(()=> div.style.borderColor="transparent", 400); 
                    hablar("Ese no cumple la regla.");
                }
            };
            zona.appendChild(div);
        });
    }

    function verificarSiNoHayMas() {
        const restantes = Array.from(document.querySelectorAll('.objeto:not(.seleccionado)'));
        return !restantes.some(div => {
            const imgName = div.querySelector('img').src.split('/').pop();
            const itemOriginal = banco.find(b => b.f === imgName);
            return itemOriginal && itemOriginal[rK] === rV;
        });
    }

    function finalizar() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        document.getElementById('metricas-finales').innerHTML = `
            <div style="color: green">Aciertos: ${aciertos}</div>
            <div style="color: red">Errores: ${errores}</div>
            <div style="margin-top:10px; font-size: 1.5rem">Eficacia: ${ef}%</div>
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("¡Misión cumplida Juan! Has demostrado una gran flexibilidad.");
    }

    function guardarYSalir() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Función Ejecutiva", 
            id_sesion: 2,       
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || []; 
        historial.push(datosSesion); 
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial)); 

        window.location.href = "funcion_sesiones.html";
    }

    window.onload = () => {
        setTimeout(generarTablero, 500);
    };
</script>
</body>
</html>
