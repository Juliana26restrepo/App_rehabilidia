<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control Inhibitorio - REHABILIDIA</title>
    <style>
        :root { 
            --p-purple: #4A148C; --s-purple: #AB47BC; --bg: #CEE5D6; --gold: #FFD700; 
            --rojo: #D32F2F; --azul: #1976D2; --amarillo: #FBC02D; --verde: #388E3C; --error: #D32F2F;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: #1a1a1a; 
            text-align: center; color: var(--p-purple); height: 100vh; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }
        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1200px; background: var(--bg); 
            position: relative; display: flex; flex-direction: column;
        }
        header { background: #103A57; height: 8%; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
        
        #juego-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 15px; }
        
        .instruccion-visual { background: white; padding: 10px; border-radius: 15px; width: 95%; border: 2px solid var(--p-purple); display: flex; justify-content: center; gap: 10px; font-weight: bold; font-size: 0.75rem; }
        .regla-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

        #info-progreso { font-size: 0.9rem; font-weight: bold; color: #103A57; }

        #estimulo-container { height: 180px; display: flex; align-items: center; justify-content: center; }
        #estimulo {
            width: 140px; height: 140px; border-radius: 50%; border: 6px solid white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 4rem; color: white; font-weight: bold;
        }

        #btn-accion {
            width: 190px; height: 190px; border-radius: 50%; background: var(--p-purple);
            color: white; border: 8px solid #ba68c8; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 10px 0 #2a0b52; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        #btn-accion:active { transform: translateY(6px); box-shadow: 0 4px 0 #2a0b52; }

        .contador-flotante { position: absolute; top: -25px; background: var(--gold); color: black; padding: 4px 12px; border-radius: 20px; border: 2px solid black; font-weight: bold; }

        #pantalla-transicion, #overlay-final { 
            position: absolute; inset: 0; display:none; flex-direction:column; 
            justify-content:center; align-items:center; z-index:2000; 
            padding: 20px; background: var(--p-purple); color: white; 
        }
        .cuadro-final { background: white; color: var(--p-purple); padding: 30px; border-radius: 25px; width: 90%; max-width: 500px; }
        .avatar-guia { width: 90px; height: 90px; background: white; border-radius: 50%; border: 4px solid var(--gold); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    </style>
</head>
<body onload="iniciarSesion()">

<div id="viewport-container">
    <header><span style="font-weight:bold;">SESIÓN 2: CONTROL INHIBITORIO</span></header>
    
    <div id="juego-area">
        <div id="info-progreso">Nivel 1 - Ejercicio 1/3</div>
        <div id="instrucciones-nivel" class="instruccion-visual"></div>

        <div id="estimulo-container">
            <div id="estimulo"></div>
        </div>
        
        <div style="position:relative;">
            <div id="cont-visual" class="contador-flotante">Toques: 0</div>
            <button id="btn-accion" onpointerdown="registrarToque()">TOCAR</button>
        </div>
    </div>

    <div id="pantalla-transicion">
        <div class="avatar-guia">👨‍⚕️</div>
        <h1 id="tit-nivel" style="background:var(--gold); color:var(--p-purple); padding:8px 30px; border-radius:40px; margin: 5px 0; font-size: 1.5rem;"></h1>
        <div id="desc-nivel" style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; font-size: 1rem; line-height: 1.4; width: 90%;"></div>
        <p style="margin-top: 15px; font-style: italic;">¡Empezamos el ejercicio!</p>
    </div>

    <div id="overlay-final">
        <div class="cuadro-final">
            <div style="font-size: 3rem;">🏆</div>
            <h1 style="margin: 10px 0;">¡EXCELENTE TRABAJO!</h1>
            <div id="stats-visual" style="font-size:1.1rem; margin:15px 0; text-align: left; padding: 0 15px;"></div>
            <button onclick="irAlMenu()" style="width:100%; padding:18px; background:#2E7D32; color:white; border-radius:50px; border:none; font-weight:bold; font-size: 1.2rem; cursor:pointer;">GUARDAR Y SALIR</button>
        </div>
    </div>
</div>

<script>
    let nivel = 1, ejercicio = 1, ronda = 1;
    let aciertos = 0, errores = 0;
    let toquesDados = 0, toquesNecesarios = 0, esperandoRespuesta = false;
    let timerEstimulo;

    const config = {
        1: { nombre: "BÁSICO", tiempo: 3500, colores: ['rojo', 'azul', 'amarillo'] },
        2: { nombre: "INTERMEDIO", tiempo: 2800, colores: ['rojo', 'azul', 'amarillo', 'verde'] },
        3: { nombre: "AVANZADO", tiempo: 2200, colores: ['rojo', 'azul', 'amarillo', 'verde', 'especial'] }
    };

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t); m.lang = 'es-ES'; m.rate = 0.9;
        window.speechSynthesis.speak(m);
    }

    function iniciarSesion() {
        mostrarTransicion();
    }

    function mostrarTransicion() {
        const c = config[nivel];
        const tit = document.getElementById('tit-nivel');
        const desc = document.getElementById('desc-nivel');
        const instUI = document.getElementById('instrucciones-nivel');
        
        tit.innerText = `NIVEL ${nivel}: ${c.nombre}`;
        
        let textoHablar = `Juan, nivel ${nivel}. `;
        let htmlReglas = `<div class="regla-item"><span class="dot" style="background:var(--rojo)"></span>R:2</div>`;
        htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--azul)"></span>A:1</div>`;
        htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--amarillo)"></span>Am:0</div>`;
        
        let instruccionTexto = "Rojo: 2 toques. Azul: 1 toque. Amarillo: NO TOCAR. ";

        if(nivel >= 2) {
            htmlReglas += `<div class="regla-item"><span class="dot" style="background:var(--verde)"></span>V:3</div>`;
            instruccionTexto += "Verde: 3 toques. ";
        }
        if(nivel === 3) {
            htmlReglas += `<div class="regla-item" style="color:var(--error); font-size:0.6rem;">⚠️X: CAMBIA</div>`;
            instruccionTexto += "¡Atención! Si el círculo tiene una X, las reglas se invierten: Si es ROJO con X no toques nada, y si es AMARILLO con X toca 2 veces.";
        }

        desc.innerText = instruccionTexto;
        instUI.innerHTML = htmlReglas;
        document.getElementById('pantalla-transicion').style.display = 'flex';
        
        hablar(instruccionTexto);
        
        setTimeout(() => {
            document.getElementById('pantalla-transicion').style.display = 'none';
            lanzarRonda();
        }, nivel === 3 ? 9000 : 6000);
    }

    function lanzarRonda() {
        // Control de Estructura: 3 Ejercicios, 4 Rondas cada uno
        if(ronda > 4) {
            if(ejercicio < 3) {
                ejercicio++;
                ronda = 1;
                hablar(`Buen ejercicio Juan. Vamos por el número ${ejercicio}.`);
                setTimeout(lanzarRonda, 2000);
            } else {
                if(nivel < 3) {
                    nivel++;
                    ejercicio = 1;
                    ronda = 1;
                    mostrarTransicion();
                } else {
                    finalizarSesion();
                }
            }
            return;
        }

        document.getElementById('info-progreso').innerText = `Nivel ${nivel} - Ejercicio ${ejercicio}/3 (Ronda ${ronda}/4)`;
        toquesDados = 0;
        document.getElementById('cont-visual').innerText = "Toques: 0";
        
        const c = config[nivel];
        let colorElegido = c.colores[Math.floor(Math.random() * c.colores.length)];
        if(colorElegido === 'especial') colorElegido = (Math.random() > 0.5) ? 'rojo' : 'amarillo';

        const tieneX = (nivel === 3 && Math.random() > 0.5);
        const circulo = document.getElementById('estimulo');
        circulo.style.background = `var(--${colorElegido})`;
        circulo.innerText = tieneX ? "X" : "";
        
        // Lógica de toques
        if(colorElegido === 'rojo') toquesNecesarios = 2;
        else if(colorElegido === 'azul') toquesNecesarios = 1;
        else if(colorElegido === 'amarillo') toquesNecesarios = 0;
        else if(colorElegido === 'verde') toquesNecesarios = 3;

        if(tieneX) {
            if(colorElegido === 'rojo') toquesNecesarios = 0;
            if(colorElegido === 'amarillo') toquesNecesarios = 2;
        }

        esperandoRespuesta = true;
        timerEstimulo = setTimeout(() => evaluarRonda(), c.tiempo);
    }

    function registrarToque() {
        if(!esperandoRespuesta) return;
        toquesDados++;
        document.getElementById('cont-visual').innerText = `Toques: ${toquesDados}`;
    }

    function evaluarRonda() {
        clearTimeout(timerEstimulo);
        esperandoRespuesta = false;
        
        const estimulo = document.getElementById('estimulo');
        if(toquesDados === toquesNecesarios) {
            aciertos++;
            estimulo.style.borderColor = "#4CAF50";
            estimulo.style.boxShadow = "0 0 25px #4CAF50";
        } else {
            errores++;
            estimulo.style.borderColor = "var(--error)";
            estimulo.style.boxShadow = "0 0 25px var(--error)";
            hablar("Cuidado.");
        }

        setTimeout(() => {
            estimulo.style.background = "transparent";
            estimulo.style.borderColor = "white";
            estimulo.style.boxShadow = "0 8px 15px rgba(0,0,0,0.2)";
            estimulo.innerText = "";
            ronda++;
            lanzarRonda();
        }, 1200);
    }

    function finalizarSesion() {
        const totalRondas = 3 * 3 * 4; // 3 niveles * 3 ejercicios * 4 rondas
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        
        document.getElementById('stats-visual').innerHTML = `
            <p><b>Rondas correctas:</b> ${aciertos}</p>
            <p><b>Rondas fallidas:</b> ${errores}</p>
            <hr>
            <h2 style="color:#2E7D32">Eficacia Final: ${ef}%</h2>
        `;
        document.getElementById('overlay-final').style.display = "flex";
        hablar("Excelente Juan. Has completado toda la sesión de control.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + errores)) * 100) || 0;
        const datos = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Control Inhibitorio", id_sesion: 2,
            aciertos: aciertos, errores: errores, eficacia: ef + "%"
        };
        let h = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || [];
        h.push(datos);
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(h));
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
