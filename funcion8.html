<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 8: Planificación y Laberintos - REHABILIDIA</title>
    <style>
        :root { 
            --navy: #103A57; 
            --gold: #FFD700; 
            --bg: #F0F4F8; 
            --wall: #1A262C; 
            --path: #FFFFFF; 
            --p-purple: #4A148C;
            --red-alert: #D32F2F;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: #1a1a1a; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100vw; height: 100vh; max-width: 1024px;
            background: var(--bg); position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header { 
            background: var(--navy); color: white; height: 45px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1rem; flex-shrink: 0;
        }

        .stats-bar { 
            display: flex; justify-content: center; gap: 20px; 
            font-weight: bold; background: white; padding: 8px; 
            border-bottom: 2px solid var(--navy); font-size: 0.9rem; 
        }

        #zona-de-trabajo { 
            flex: 1; display: flex; flex-direction: row; 
            align-items: center; justify-content: center; gap: 20px; 
            padding: 10px; overflow: hidden;
        }

        #canvas-contenedor { 
            background: var(--wall); padding: 5px; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center;
            max-width: 65%;
        }

        canvas { background: var(--path); border-radius: 4px; }

        .panel-derecho { 
            display: flex; flex-direction: column; align-items: center; 
            background: white; padding: 15px; border-radius: 20px; 
            border: 3px solid var(--navy); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .controles-grid { display: grid; grid-template-areas: ". up ." "left down right"; gap: 10px; }
        
        .btn-dir { 
            width: 60px; height: 60px; background: white; 
            border: 3px solid var(--navy); border-radius: 50%; 
            font-size: 1.5rem; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; 
            box-shadow: 0 4px 0 var(--navy);
        }

        .btn-dir:active { background: var(--gold); transform: translateY(2px); box-shadow: 0 2px 0 var(--navy); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16, 58, 87, 0.98); color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
        
        .cuadro-final { background: white; color: var(--navy); padding: 25px; border-radius: 25px; border: 5px solid var(--gold); width: 90%; max-width: 400px; }

        .btn-ready { background: var(--gold); border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.2rem; color: var(--navy); margin-top: 15px; }

        @media (max-width: 600px) {
            #zona-de-trabajo { flex-direction: column; }
            #canvas-contenedor { max-width: 95%; }
        }
    </style>
</head>
<body onload="iniciarApp()">

<div id="viewport-container">
    <header>SESIÓN 8: PLANIFICACIÓN Y ANTICIPACIÓN</header>

    <div class="stats-bar">
        <span id="txt-nivel">Nivel: 1</span>
        <span id="txt-intento">Laberinto: 1 / 3</span>
        <span id="txt-errores" style="color: var(--red-alert);">Choques: 0</span>
    </div>

    <div id="zona-de-trabajo">
        <div id="canvas-contenedor">
            <canvas id="laberintoCanvas"></canvas>
        </div>

        <div class="panel-derecho">
            <div style="margin-bottom:10px; font-weight:bold; color: var(--navy);">CONTROL</div>
            <div class="controles-grid">
                <button class="btn-dir" style="grid-area: up" onpointerdown="iniciarMovimiento('up')" onpointerup="pararMovimiento()">↑</button>
                <button class="btn-dir" style="grid-area: left" onpointerdown="iniciarMovimiento('left')" onpointerup="pararMovimiento()">←</button>
                <button class="btn-dir" style="grid-area: down" onpointerdown="iniciarMovimiento('down')" onpointerup="pararMovimiento()">↓</button>
                <button class="btn-dir" style="grid-area: right" onpointerdown="iniciarMovimiento('right')" onpointerup="pararMovimiento()">→</button>
            </div>
        </div>
    </div>

    <div id="overlay-msg" class="overlay">
        <h1 id="msg-titulo" style="color: var(--gold); margin: 0;"></h1>
        <p id="msg-cuerpo" style="font-size: 1.2rem; max-width: 80%;"></p>
        <button class="btn-ready" onclick="cerrarOverlay()">COMENZAR</button>
    </div>

    <div id="overlay-final" class="overlay">
        <div class="cuadro-final">
            <h2 style="color: var(--p-purple); margin-top: 0;">¡SESIÓN COMPLETADA!</h2>
            <div id="stats-resumen" style="font-size: 1.1rem; margin: 15px 0; line-height: 1.6;"></div>
            <button class="btn-ready" onclick="irAlMenu()">GUARDAR Y VOLVER</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('laberintoCanvas');
    const ctx = canvas.getContext('2d');
    
    let nivel = 1, intento = 1, aciertos = 0, errores = 0;
    let jugador = { x: 1, y: 1 }, mapa = [];
    let tamCelda = 25, filas, columnas, tieneLlave = false;
    let intervaloMovimiento = null;

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
    }

    function iniciarApp() {
        mostrarOverlay("PLANIFICACIÓN", "Juan, recorre el camino sin tocar las paredes. En niveles avanzados, busca la llave dorada antes de salir.");
    }

    function mostrarOverlay(tit, msj) {
        document.getElementById('msg-titulo').innerText = tit;
        document.getElementById('msg-cuerpo').innerText = msj;
        document.getElementById('overlay-msg').style.display = 'flex';
        hablar(msj);
    }

    function cerrarOverlay() {
        document.getElementById('overlay-msg').style.display = 'none';
        generarLaberinto();
    }

    function generarLaberinto() {
        if(nivel === 1) { filas = 11; columnas = 11; tamCelda = 30; tieneLlave = true; }
        else if(nivel === 2) { filas = 15; columnas = 15; tamCelda = 22; tieneLlave = true; }
        else { filas = 19; columnas = 19; tamCelda = 18; tieneLlave = false; }

        canvas.width = columnas * tamCelda;
        canvas.height = filas * tamCelda;
        mapa = Array.from({ length: filas }, () => Array(columnas).fill(1));

        function excavar(x, y) {
            mapa[y][x] = 0;
            const vecinos = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            vecinos.forEach(([dx, dy]) => {
                let nx = x + dx, ny = y + dy;
                if(nx > 0 && nx < columnas-1 && ny > 0 && ny < filas-1 && mapa[ny][nx] === 1) {
                    mapa[y + dy/2][x + dx/2] = 0;
                    excavar(nx, ny);
                }
            });
        }
        excavar(1, 1);

        mapa[filas-2][columnas-2] = 2; // Meta
        if(nivel === 3) {
            mapa[1][columnas-2] = 3; // Llave obligatoria en nivel 3
            tieneLlave = false;
        }

        jugador = { x: 1, y: 1 };
        actualizarUI();
        dibujar();
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let r=0; r<filas; r++) {
            for(let c=0; c<columnas; c++) {
                if(mapa[r][c] === 1) {
                    ctx.fillStyle = "#1A262C";
                    ctx.fillRect(c*tamCelda, r*tamCelda, tamCelda, tamCelda);
                } else if(mapa[r][c] === 2) {
                    ctx.fillStyle = tieneLlave ? "#4CAF50" : "#999";
                    ctx.fillRect(c*tamCelda, r*tamCelda, tamCelda, tamCelda);
                } else if(mapa[r][c] === 3) {
                    ctx.fillStyle = "#FFD700";
                    ctx.beginPath();
                    ctx.arc(c*tamCelda + tamCelda/2, r*tamCelda + tamCelda/2, tamCelda/3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        ctx.fillStyle = "#D32F2F";
        ctx.beginPath();
        ctx.arc(jugador.x*tamCelda + tamCelda/2, jugador.y*tamCelda + tamCelda/2, tamCelda/2.5, 0, Math.PI*2);
        ctx.fill();
    }

    function iniciarMovimiento(dir) {
        if(intervaloMovimiento) return;
        mover(dir);
        intervaloMovimiento = setInterval(() => mover(dir), 120);
    }

    function pararMovimiento() {
        clearInterval(intervaloMovimiento);
        intervaloMovimiento = null;
    }

    function mover(dir) {
        let nx = jugador.x, ny = jugador.y;
        if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;

        if(ny >= 0 && ny < filas && nx >= 0 && nx < columnas) {
            if(mapa[ny][nx] === 1) {
                errores++;
                actualizarUI();
                return;
            }
            if(mapa[ny][nx] === 3) {
                tieneLlave = true;
                mapa[ny][nx] = 0;
                hablar("Llave obtenida");
            }
            if(mapa[ny][nx] === 2) {
                if(!tieneLlave) { hablar("Busca la llave"); return; }
                gestionarVictoria();
                return;
            }
            jugador.x = nx; jugador.y = ny;
            dibujar();
        }
    }

    function gestionarVictoria() {
        pararMovimiento();
        aciertos++;
        if(intento < 3) {
            intento++; 
            generarLaberinto();
        } else if(nivel < 3) {
            nivel++; intento = 1;
            mostrarOverlay("Nivel Completado", "Avanzamos a un laberinto más grande.");
        } else {
            finalizar();
        }
    }

    function actualizarUI() {
        document.getElementById('txt-nivel').innerText = `Nivel: ${nivel}`;
        document.getElementById('txt-intento').innerText = `Laberinto: ${intento} / 3`;
        document.getElementById('txt-errores').innerText = `Choques: ${errores}`;
    }

    function finalizar() {
        const ef = Math.round((aciertos / (aciertos + (errores*0.1))) * 100);
        document.getElementById('stats-resumen').innerHTML = `
            <strong>Laberintos logrados:</strong> ${aciertos}<br>
            <strong>Choques con muros:</strong> ${errores}<br>
            <strong>Eficacia:</strong> ${ef}%
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("Muy bien Juan, has planificado cada paso correctamente.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + (errores*0.1))) * 100) || 0;
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas", 
            id_sesion: 8,      
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || []; 
        historial.push(datosSesion); 
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial)); 
        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
