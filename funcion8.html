<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sesión 8: Planificación Estratégica - REHABILIDIA</title>
    <style>
        :root { 
            --navy: #103A57; 
            --gold: #FFD700; 
            --bg: #F0F4F8; 
            --wall: #1A262C; 
            --path: #FFFFFF; 
            --p-purple: #4A148C;
            --red-alert: #D32F2F;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: var(--bg); 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #viewport-container {
            width: 100%; height: 100%; max-width: 1024px;
            display: flex; flex-direction: column; position: relative;
        }

        header { 
            background: var(--navy); color: white; height: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.1rem; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .stats-bar { 
            display: flex; justify-content: space-around; 
            font-weight: bold; background: white; padding: 10px; 
            border-bottom: 2px solid #ddd; font-size: 1rem; 
        }

        #zona-de-trabajo { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            padding: 15px; gap: 15px; overflow: hidden;
        }

        /* Contenedor flexible para el laberinto */
        #canvas-contenedor { 
            background: var(--wall); padding: 10px; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 100%; max-height: 60vh; /* Evita que crezca demasiado */
        }

        canvas { 
            max-width: 100%; max-height: 100%; 
            display: block; border-radius: 5px; 
        }

        .panel-controles { 
            background: white; padding: 15px; border-radius: 20px; 
            border: 2px solid var(--navy); display: flex; 
            flex-direction: column; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .controles-grid { display: grid; grid-template-areas: ". up ." "left down right"; gap: 10px; }
        
        .btn-dir { 
            width: 55px; height: 55px; background: white; 
            border: 3px solid var(--navy); border-radius: 50%; 
            font-size: 1.4rem; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; 
            box-shadow: 0 4px 0 var(--navy);
        }

        .btn-dir:active { background: var(--gold); transform: translateY(2px); box-shadow: 0 2px 0 var(--navy); }

        /* Overlays corregidos */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16, 58, 87, 0.98); color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 30px; }
        
        .cuadro-final { background: white; color: var(--navy); padding: 30px; border-radius: 25px; border: 5px solid var(--gold); width: 90%; max-width: 450px; }

        .btn-ready { background: var(--gold); border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 1.2rem; color: var(--navy); margin-top: 20px; box-shadow: 0 4px 0 #b8860b; }

        @media (min-width: 768px) {
            #zona-de-trabajo { flex-direction: row; }
            #canvas-contenedor { max-width: 60%; }
        }
    </style>
</head>
<body onload="iniciarApp()">

<div id="viewport-container">
    <header>MÓDULO: FUNCIONES EJECUTIVAS - SESIÓN 8</header>

    <div class="stats-bar">
        <span id="txt-nivel">Nivel: 1</span>
        <span id="txt-intento">Reto: 1 / 3</span>
        <span id="txt-errores" style="color: var(--red-alert);">Errores: 0</span>
    </div>

    <div id="zona-de-trabajo">
        <div id="canvas-contenedor">
            <canvas id="laberintoCanvas"></canvas>
        </div>

        <div class="panel-controles">
            <div style="margin-bottom:8px; font-weight:bold; color: var(--navy); font-size: 0.9rem;">MOVIMIENTO</div>
            <div class="controles-grid">
                <button class="btn-dir" style="grid-area: up" onpointerdown="iniciarMovimiento('up')" onpointerup="pararMovimiento()">↑</button>
                <button class="btn-dir" style="grid-area: left" onpointerdown="iniciarMovimiento('left')" onpointerup="pararMovimiento()">←</button>
                <button class="btn-dir" style="grid-area: down" onpointerdown="iniciarMovimiento('down')" onpointerup="pararMovimiento()">↓</button>
                <button class="btn-dir" style="grid-area: right" onpointerdown="iniciarMovimiento('right')" onpointerup="pararMovimiento()">→</button>
            </div>
            <div style="margin-top:10px; font-size:0.7rem; color: #555;">O usa las flechas del teclado</div>
        </div>
    </div>

    <div id="overlay-msg" class="overlay">
        <h1 id="msg-titulo" style="color: var(--gold);"></h1>
        <p id="msg-cuerpo" style="font-size: 1.3rem; line-height: 1.5;"></p>
        <button class="btn-ready" onclick="cerrarOverlay()">COMENZAR</button>
    </div>

    <div id="overlay-final" class="overlay">
        <div class="cuadro-final">
            <h2 style="color: var(--p-purple);">¡SESIÓN COMPLETADA!</h2>
            <div id="stats-resumen" style="font-size: 1.2rem; margin: 20px 0;"></div>
            <button class="btn-ready" onclick="irAlMenu()">GUARDAR Y VOLVER</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('laberintoCanvas');
    const ctx = canvas.getContext('2d');
    
    let nivel = 1, intento = 1, aciertos = 0, errores = 0;
    let jugador = { x: 1, y: 1 }, mapa = [];
    let tamCelda, filas, columnas, tieneLlave = false;
    let intervaloMovimiento = null;

    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        window.speechSynthesis.speak(m);
    }

    function iniciarApp() {
        mostrarOverlay("SESIÓN 8: PLANIFICACIÓN", "Juan, planifica bien tu ruta. En los niveles avanzados deberás recoger la llave dorada para abrir la salida verde.");
    }

    function mostrarOverlay(tit, msj) {
        document.getElementById('msg-titulo').innerText = tit;
        document.getElementById('msg-cuerpo').innerText = msj;
        document.getElementById('overlay-msg').style.display = 'flex';
        hablar(msj);
    }

    function cerrarOverlay() {
        document.getElementById('overlay-msg').style.display = 'none';
        generarLaberinto();
    }

    function generarLaberinto() {
        // Laberintos de alta complejidad (2 meses de rehabilitación)
        if(nivel === 1) { filas = 15; columnas = 15; tamCelda = 22; tieneLlave = true; }
        else if(nivel === 2) { filas = 21; columnas = 21; tamCelda = 16; tieneLlave = false; }
        else { filas = 27; columnas = 27; tamCelda = 13; tieneLlave = false; }

        canvas.width = columnas * tamCelda;
        canvas.height = filas * tamCelda;
        mapa = Array.from({ length: filas }, () => Array(columnas).fill(1));

        function excavar(x, y) {
            mapa[y][x] = 0;
            const vecinos = [[0,2],[0,-2],[2,0],[-2,0]].sort(() => Math.random() - 0.5);
            vecinos.forEach(([dx, dy]) => {
                let nx = x + dx, ny = y + dy;
                if(nx > 0 && nx < columnas-1 && ny > 0 && ny < filas-1 && mapa[ny][nx] === 1) {
                    mapa[y + dy/2][x + dx/2] = 0;
                    excavar(nx, ny);
                }
            });
        }
        excavar(1, 1);

        mapa[filas-2][columnas-2] = 2; // Meta
        if(nivel > 1) mapa[1][columnas-2] = 3; // Llave obligatoria en esquinas opuestas

        jugador = { x: 1, y: 1 };
        actualizarUI();
        dibujar();
    }

    function dibujar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let r=0; r<filas; r++) {
            for(let c=0; c<columnas; c++) {
                if(mapa[r][c] === 1) {
                    ctx.fillStyle = "#1A262C";
                    ctx.fillRect(c*tamCelda, r*tamCelda, tamCelda, tamCelda);
                } else if(mapa[r][c] === 2) {
                    ctx.fillStyle = tieneLlave ? "#4CAF50" : "#546E7A";
                    ctx.fillRect(c*tamCelda, r*tamCelda, tamCelda, tamCelda);
                } else if(mapa[r][c] === 3) {
                    ctx.fillStyle = "#FFD700";
                    ctx.beginPath();
                    ctx.arc(c*tamCelda + tamCelda/2, r*tamCelda + tamCelda/2, tamCelda/3, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        // Jugador
        ctx.fillStyle = "#D32F2F";
        ctx.beginPath();
        ctx.arc(jugador.x*tamCelda + tamCelda/2, jugador.y*tamCelda + tamCelda/2, tamCelda/2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function iniciarMovimiento(dir) {
        if(intervaloMovimiento) return;
        mover(dir);
        intervaloMovimiento = setInterval(() => mover(dir), 110);
    }

    function pararMovimiento() {
        clearInterval(intervaloMovimiento);
        intervaloMovimiento = null;
    }

    function mover(dir) {
        let nx = jugador.x, ny = jugador.y;
        if(dir === 'up') ny--; if(dir === 'down') ny++; if(dir === 'left') nx--; if(dir === 'right') nx++;

        if(ny >= 0 && ny < filas && nx >= 0 && nx < columnas) {
            if(mapa[ny][nx] === 1) {
                errores++;
                actualizarUI();
                return;
            }
            if(mapa[ny][nx] === 3) {
                tieneLlave = true;
                mapa[ny][nx] = 0;
                hablar("¡Llave obtenida!");
            }
            if(mapa[ny][nx] === 2) {
                if(!tieneLlave) { hablar("Busca la llave"); return; }
                gestionarVictoria();
                return;
            }
            jugador.x = nx; jugador.y = ny;
            dibujar();
        }
    }

    function gestionarVictoria() {
        pararMovimiento();
        aciertos++;
        if(intento < 3) {
            intento++; 
            generarLaberinto();
        } else if(nivel < 3) {
            nivel++; intento = 1;
            mostrarOverlay("Nivel Completado", "Aumentamos el tamaño del mapa. ¡Sigue así!");
        } else {
            finalizar();
        }
    }

    function actualizarUI() {
        document.getElementById('txt-nivel').innerText = `Nivel: ${nivel}`;
        document.getElementById('txt-intento').innerText = `Reto: ${intento} / 3`;
        document.getElementById('txt-errores').innerText = `Errores: ${errores}`;
    }

    window.addEventListener('keydown', (e) => {
        if(e.key === "ArrowUp") mover('up');
        if(e.key === "ArrowDown") mover('down');
        if(e.key === "ArrowLeft") mover('left');
        if(e.key === "ArrowRight") mover('right');
    });

    function finalizar() {
        const ef = Math.round((aciertos / (aciertos + (errores * 0.1))) * 100);
        document.getElementById('stats-resumen').innerHTML = `
            <b>Aciertos:</b> ${aciertos}<br>
            <b>Errores:</b> ${errores}<br>
            <b>Eficacia:</b> ${ef}%
        `;
        document.getElementById('overlay-final').style.display = 'flex';
        hablar("Juan, has terminado con éxito. Tu planificación ha sido excelente.");
    }

    function irAlMenu() {
        const ef = Math.round((aciertos / (aciertos + (errores * 0.1))) * 100) || 0;
        
        // CORRECCIÓN CLAVE: El id_sesion ahora es numérico para evitar el "undefined"
        const datosSesion = {
            fecha: new Date().toLocaleDateString(),
            modulo: "Funciones Ejecutivas", 
            id_sesion: 8, // Se cambia a número para que el sistema lo reconozca
            nombre_sesion: "Sesión 8", // Campo extra de seguridad
            aciertos: aciertos,
            errores: errores,
            eficacia: ef + "%"
        };

        let historial = JSON.parse(localStorage.getItem('sesiones_rehabilitidia')) || []; 
        historial.push(datosSesion); 
        localStorage.setItem('sesiones_rehabilitidia', JSON.stringify(historial)); 

        window.location.href = "funcion_sesiones.html";
    }
</script>
</body>
</html>
